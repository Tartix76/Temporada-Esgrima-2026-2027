<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sable femenino 2026-27 · Nacional y Madrid</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f6fa;color:#182033}header{background:#18345f;color:#fff;padding:14px 18px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h1{font-size:20px;margin:0 auto 0 0}.top button{border:1px solid #ffffff66;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.top button.on{background:#fff;color:#18345f}.top button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}.refresh{background:#b4232c!important;border-color:#b4232c!important}.refresh[disabled]{opacity:.65;cursor:wait}#status{font-size:12px;opacity:.9;margin-top:7px}iframe{display:block;width:100%;height:calc(100vh - 98px);border:0;background:#f5f6fa}@media(max-width:600px){.top h1{width:100%;font-size:17px}iframe{height:calc(100vh - 135px)}}</style></head><body><header><div class="top"><h1>Sable femenino · Temporada 2026-27</h1><button id="nationalBtn" class="on" type="button">Nacional · RFEE</button><button id="regionalBtn" type="button">Regional · Madrid</button><button id="refreshBtn" class="refresh" type="button">↻ Comprobar datos</button></div><div id="status" role="status" aria-live="polite">Vista nacional</div></header><iframe id="dashboardFrame" title="Dashboard de sable femenino" src="nacional.html"></iframe><script>(()=>{const frame=document.querySelector('#dashboardFrame'),status=document.querySelector('#status'),national=document.querySelector('#nationalBtn'),regional=document.querySelector('#regionalBtn'),refresh=document.querySelector('#refreshBtn');let page='nacional.html';function show(next){page=next;frame.src=next+'?v='+Date.now();national.classList.toggle('on',next==='nacional.html');regional.classList.toggle('on',next==='regional.html');status.textContent=next==='nacional.html'?'Vista nacional · RFEE':'Vista regional · Federación Madrileña de Esgrima'}national.addEventListener('click',()=>show('nacional.html'));regional.addEventListener('click',()=>show('regional.html'));refresh.addEventListener('click',()=>{refresh.disabled=true;status.textContent='Descargando la última versión publicada…';frame.src=page+'?v='+Date.now();frame.addEventListener('load',()=>{refresh.disabled=false;status.textContent='Última versión comprobada · '+new Date().toLocaleString('es-ES')},{once:true})})})();</script></body></html>
