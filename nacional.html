<script>
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const pd=s=>{const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d)};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#snap').textContent=SNAPSHOT;

// ---------- Fórmula RFEE ----------
function bonus(p){return p==1?1414:p==2?1212:p<5?1010:p<9?808:p<17?606:p<33?404:p<65?202:p<129?101:0}
function pts(pos,n,coef=1){if(!(pos>=1)||!(n>=2)||pos>n)return NaN;return (bonus(pos)+1000*(1.01-Math.log10(pos)/Math.log10(n)))*coef}

// ---------- Sub23 estimado (2 mejores TNR ABS de nacidas en 2004 o después) ----------
const ABS_ALL=RES.filter(r=>r.cat=='ABS');const ABS_RES=ABS_ALL[0];
{const m={};ABS_ALL.forEach(t=>t.rows.filter(r=>r[4]>=2004).forEach(r=>{const k=r[1]+'|'+r[2];(m[k]=m[k]||{r,p:[]}).p.push(r[5])}));
RK.M23=Object.values(m).map(({r,p})=>[0,r[1],r[2],r[4],r[3],Math.round(p.sort((a,b)=>b-a).slice(0,2).reduce((s,x)=>s+x,0)*100)/100]).sort((a,b)=>b[5]-a[5]);}
{let last=null,pos=0;RK.M23.forEach((r,i)=>{if(r[5]!==last){pos=i+1;last=r[5]}r[0]=pos})}

const CATS=[["M13","M13"],["M15","M15 (Infantil)"],["M17","M17 (Cadete)"],["M20","M20 (Junior)"],["M23","Sub23"],["ABS","Absoluto"]];
const CATNAME=Object.fromEntries(CATS);
// Reglas de ranking (Normativa 26-27, apdo. 1.3)
const RULES={
 M13:{carry:0,best:"2 TNR M13 + Cto. España",comps:[["TNR M13",1],["Cto. España M13",1.25]],n:25},
 M15:{carry:0,best:"Resultados de los TNR M15 + Cto. España",comps:[["TNR M15",1],["Cto. España M15",1.25]],n:34},
 M17:{carry:10,best:"3 mejores entre 2 TNR M17 y 2 TNR M20 + Cto. España",comps:[["TNR M17",1],["TNR M20",1.25],["Cto. España M17",1.25],["Cto. España M20",1.5]],n:42},
 M20:{carry:15,best:"3 mejores entre 2 TNR M20 y 3 TNR ABS + Cto. España",comps:[["TNR M20",1],["TNR Absoluto",1.25],["Cto. España M20",1.25],["Cto. España Sub23",1.25],["Cto. España Absoluto",1.5]],n:55},
 M23:{carry:0,best:"2 mejores de los 3 TNR ABS + Cto. España",comps:[["TNR Absoluto",1],["Cto. España Sub23",1.25],["Cto. España Absoluto",1.5]],n:68},
 ABS:{carry:20,best:"2 mejores de los 3 TNR ABS + Cto. España",comps:[["TNR Absoluto",1],["Cto. España Absoluto",1.25]],n:68}
};
const CUTS={M17:[[10,"Top 10 · PFCAR / Europeo"],[20,"Top 20 · pueden inscribirse en internacionales"],[38,"Top 38 · plaza directa Cto. España"]],M20:[[10,"Top 10 · Europeo (ranking interno)"],[20,"Top 20 · pueden inscribirse en internacionales"],[38,"Top 38 · plaza directa Cto. España"]],ABS:[[20,"Top 20 · pueden inscribirse en Copas del Mundo/GP"]],M23:[[10,"Top 10 · pueden inscribirse al Europeo Sub23"]]};

// ---------- Tabs ----------
const TABS=[["resumen","Resumen"],["ranking","Rankings"],["calendario","Calendario"],["resultados","Resultados"],["interno","Ranking interno"],["calc","Calculadora de puntos"],["normativa","Normativa clave"]];
$('#nav').innerHTML=TABS.map(([k,l],i)=>`<button data-t="${k}" class="${i?'':'on'}">${l}</button>`).join('');
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));TABS.forEach(([k])=>$('#t-'+k).classList.toggle('hide',k!=t))};
const go=t=>document.querySelector(`#nav button[data-t="${t}"]`).click();

// ---------- Calendario helpers ----------
const EV=CAL.map(c=>({d:pd(c[0]),date:c[0],name:c[1],cat:c[2],mod:c[3],place:c[4],tipo:c[5],amb:c[6],fin:c[7],ins:c[8],sede:c[9]||'',links:c[10]||[],punt:c[11]||[]}));
const fx=v=>String(v).replace('.',',');
const ptag=e=>e.punt.map(([r,f,n])=>`<span class="tag p" title="${n?esc(n):''}">Interno ${r} ×${fx(f)}${n&&n!='nacional'?' (?)':''}</span>`).join('');
const daysTo=d=>Math.round((d-TODAY)/864e5);
function evRow(e){const dd=daysTo(e.d);const past=dd<0;
 const finD=e.fin?pd(e.fin):null;const fd=finD?daysTo(finD):null;
 let when=past?'Celebrada':dd==0?'¡Hoy!':`en ${dd} día${dd==1?'':'s'}`;
 let insc=e.fin?(fd>=0?`<span class="tag w">Inscripción hasta ${e.fin}${fd<=7?` (${fd} d)`:''}</span>`:(past?'':`<span class="tag">Inscripción cerrada</span>`)):'';
 return `<div class="ev ${past?'past':''}"><div class="date"><b>${e.d.getDate()}</b><span>${MES[e.d.getMonth()]} ${String(e.d.getFullYear()).slice(2)}</span></div>
 <div><div class="t">${esc(e.name)} ${e.mod=='E'?'<span class="tag">Equipos</span>':''}</div>
 <div class="small mut">${esc(e.place)}${e.sede?' · '+esc(e.sede):''} · ${esc(e.tipo)}${e.ins?` · ${e.ins} inscritas`:''}</div>
 <div class="row" style="margin-top:4px;gap:6px"><span class="tag ${e.amb=='N'?'n':'i'}">${e.amb=='N'?'Nacional':'Internacional'}</span><span class="tag">${CATNAME[e.cat]||e.cat}</span>${ptag(e)}${insc}
 ${e.links.map(([l,u])=>`<a class="small" href="${u}" target="_blank">${l}</a>`).join(' ')}</div></div>
 <div class="small ${past?'mut':''}" style="text-align:right;font-weight:600">${when}</div></div>`}

// ---------- RESUMEN ----------
function renderResumen(){
 const up=EV.filter(e=>daysTo(e.d)>=0&&e.mod=='I');
 const nextN=up.find(e=>e.amb=='N'), nextI=up.find(e=>e.amb=='I');
 const openIns=EV.filter(e=>e.fin&&daysTo(pd(e.fin))>=0&&e.mod=='I').sort((a,b)=>pd(a.fin)-pd(b.fin))[0];
 const leaders=CATS.map(([k,l])=>{const r=RK[k].find(x=>x[5]>0);return `<tr><td><b>${l}</b>${k=='M23'?' <span class="tag w">estimado</span>':''}</td><td>${r?esc(r[1]+' '+r[2]):'<span class="mut">Sin puntos aún</span>'}</td><td>${r?r[4]:''}</td><td class="n">${r?fmt(r[5]):'—'}</td></tr>`}).join('');
 $('#t-resumen').innerHTML=`
 <div class="grid g4">
  <div class="card kpi"><div class="lab">Próxima nacional</div><div class="val">${nextN?esc(nextN.name):'—'}</div><div class="det">${nextN?`${nextN.date} · ${esc(nextN.place)} · en ${daysTo(nextN.d)} días`:''}</div></div>
  <div class="card kpi"><div class="lab">Próxima internacional</div><div class="val">${nextI?esc(nextI.name):'—'}</div><div class="det">${nextI?`${nextI.date} · ${esc(nextI.place)} · en ${daysTo(nextI.d)} días`:''}</div></div>
  <div class="card kpi"><div class="lab">Próximo cierre de inscripción</div><div class="val">${openIns?openIns.fin:'—'}</div><div class="det">${openIns?`${esc(openIns.name)} · ${esc(openIns.place)}`:''}</div></div>
  <div class="card kpi"><div class="lab">TNR ya disputados (SF)</div><div class="val">${RES.length}</div><div class="det">${RES.map(r=>r.name).join(' · ')}</div></div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>Líderes del ranking nacional</h3><table><thead><tr><th>Categoría</th><th>Líder</th><th>Club</th><th class="n">Puntos</th></tr></thead><tbody>${leaders}</tbody></table>
  <p class="small mut">M13 y M15 aún no han disputado ninguna prueba puntuable (1.º TNR: 21 y 22/11/2026). Sub23 no se publica en Skermo: se estima con el TNR ABS para nacidas en 2004 o después.</p>
  <button class="chip" onclick="go('ranking')">Ver rankings completos →</button></div>
  <div class="card"><h3>Próximas competiciones</h3>${up.slice(0,7).map(evRow).join('')}<div style="margin-top:10px"><button class="chip" onclick="go('calendario')">Ver calendario completo →</button></div></div>
 </div>
 <div class="note" style="margin-top:14px">Los Campeonatos de España 2026-27 y el 3.er TNR Absoluto todavía no aparecen en el calendario de Skermo. Esta página es una foto de los datos a ${(SNAPSHOT)}; pídeme que la actualice tras cada competición.</div>`;
}

// ---------- RANKING ----------
let rkCat='M17',rkQ='',rkClub='';
function renderRanking(){
 const rows=RK[rkCat];const max=Math.max(...rows.map(r=>r[5]),1);
 const clubs=[...new Set(rows.map(r=>r[4]))].sort();
 const q=rkQ.toLowerCase();
 const f=rows.filter(r=>(!q||(r[1]+' '+r[2]).toLowerCase().includes(q))&&(!rkClub||r[4]==rkClub));
 const noPts=rows.every(r=>!r[5]);
 const cuts=Object.fromEntries((CUTS[rkCat]||[]).map(c=>[c[0],c[1]]));
 const rule=RULES[rkCat];
 const body=noPts?f.map((r,i)=>`<tr><td class="n mut">—</td><td>${esc(r[1]+' '+r[2])}</td><td>${r[4]}</td><td>${r[3]}</td><td class="n mut">0,00</td><td></td></tr>`).join('')
 :f.map(r=>`<tr class="${cuts[r[0]]&&!rkQ&&!rkClub?'cut':''}" title="${cuts[r[0]]||''}"><td class="n"><b>${r[0]}</b></td><td>${esc(r[1]+' '+r[2])}</td><td>${r[4]}</td><td>${r[3]}</td><td class="n">${fmt(r[5])}</td><td><div class="bar"><i style="width:${r[5]/max*100}%"></i></div></td></tr>`).join('');
 $('#t-ranking').innerHTML=`<div class="card">
 <div class="chips">${CATS.map(([k,l])=>`<button class="chip ${k==rkCat?'on':''}" data-c="${k}">${l}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:10px"><input id="rkq" placeholder="Buscar tiradora…" value="${esc(rkQ)}" style="min-width:220px"><select id="rkclub"><option value="">Todos los clubes</option>${clubs.map(c=>`<option ${c==rkClub?'selected':''}>${c}</option>`).join('')}</select>
 <span class="small mut">Cuenta: ${rule.best} · arrastre temporada anterior ${rule.carry}%</span></div>
 ${rkCat=='M23'?`<div class="note" style="margin-bottom:10px">Ranking Sub23 <b>estimado</b>: Skermo no publica ranking Sub23. Se calcula con los puntos de ${ABS_ALL.length>1?'los 2 mejores TNR ABS ('+ABS_ALL.map(r=>r.name).join(', ')+')':'el '+ABS_RES.name}${ABS_ALL.length>1?'':''} de las tiradoras nacidas en 2004 o después (arrastre 0%).</div>`:''}
 ${noPts?`<div class="note" style="margin-bottom:10px">Aún sin pruebas puntuables en ${CATNAME[rkCat]}. Se listan las ${rows.length} tiradoras inscritas en el ranking; el primer TNR es el ${rkCat=='M15'?'21/11/2026':'22/11/2026'} en Madrid.</div>`:''}
 ${(CUTS[rkCat]&&!noPts)?`<div class="small mut" style="margin-bottom:8px">Línea roja discontinua: ${(CUTS[rkCat]).map(c=>c[1]).join(' · ')}</div>`:''}
 <div class="tbl"><table><thead><tr><th class="n">#</th><th>Tiradora</th><th>Club</th><th>Año</th><th class="n">Puntos</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
 <p class="small mut">Fuente: <a target="_blank" href="https://app.skermo.org/ranking-rfee/public/RFEE?season=17&weapon=S&category=${({M13:12,M15:4,M17:5,M20:6,ABS:7})[rkCat]||7}&gender=W">Skermo · Ranking Nacional</a> (${(SNAPSHOT)}).</p></div>`;
 $('#t-ranking .chips').onclick=e=>{if(e.target.dataset.c){rkCat=e.target.dataset.c;rkClub='';renderRanking()}};
 const qi=$('#rkq');qi.oninput=()=>{rkQ=qi.value;const p=qi.selectionStart;renderRanking();const n=$('#rkq');n.focus();n.setSelectionRange(p,p)};
 $('#rkclub').onchange=e=>{rkClub=e.target.value;renderRanking()};
}

// ---------- CALENDARIO ----------
let calCat='all',calAmb='all',calPast=false,calEq=false,calInt='';
function renderCal(){
 const f=EV.filter(e=>(calCat=='all'||e.cat==calCat)&&(calAmb=='all'||e.amb==calAmb)&&(calPast||daysTo(e.d)>=0)&&(calEq||e.mod=='I')&&(!calInt||e.punt.some(p=>calInt=='any'||p[0]==calInt)));
 const byMonth={};f.forEach(e=>{const k=e.d.getFullYear()*100+e.d.getMonth();(byMonth[k]=byMonth[k]||[]).push(e)});
 const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 $('#t-calendario').innerHTML=`<div class="card">
 <div class="chips" id="cc"><button class="chip ${calCat=='all'?'on':''}" data-c="all">Todas</button>${CATS.map(([k,l])=>`<button class="chip ${k==calCat?'on':''}" data-c="${k}">${l}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:6px">
  <select id="camb"><option value="all">Nacionales e internacionales</option><option value="N" ${calAmb=='N'?'selected':''}>Solo nacionales</option><option value="I" ${calAmb=='I'?'selected':''}>Solo internacionales</option></select>
  <label class="small"><input type="checkbox" id="cpast" ${calPast?'checked':''}> Mostrar celebradas</label>
  <select id="cint"><option value="">Todas (puntúen o no)</option><option value="any" ${calInt=='any'?'selected':''}>Solo puntuables ranking interno</option>${['Cadete','Junior','Sub23'].map(r=>`<option value="${r}" ${calInt==r?'selected':''}>Puntúa ranking interno ${r}</option>`).join('')}</select>
  <label class="small"><input type="checkbox" id="ceq" ${calEq?'checked':''}> Incluir equipos / Liga</label>
  <span class="small mut">${f.length} competiciones</span></div>
 ${Object.keys(byMonth).sort().map(k=>`<h3 style="margin:18px 0 0;font-size:14px;color:var(--acc2)">${MESL[k%100]} ${Math.floor(k/100)}</h3>${byMonth[k].map(evRow).join('')}`).join('')||'<p class="mut">No hay competiciones con estos filtros.</p>'}
 <p class="small mut">"Interno Cadete/Junior/Sub23 ×factor" = la competición puntúa para ese ranking interno RFEE con ese multiplicador (Criterios de participación y selección 26-27). Las nacionales (×0,75) cuentan solo las 2 mejores; las internacionales, las 2 mejores. (?) = la fecha o sede de Skermo no coincide exactamente con el documento. Fuente: <a target="_blank" href="https://app.skermo.org/calendar/public/RFEE">Skermo · Calendario</a>.</p></div>`;
 $('#cc').onclick=e=>{if(e.target.dataset.c){calCat=e.target.dataset.c;renderCal()}};
 $('#camb').onchange=e=>{calAmb=e.target.value;renderCal()};$('#cpast').onchange=e=>{calPast=e.target.checked;renderCal()};$('#ceq').onchange=e=>{calEq=e.target.checked;renderCal()};$('#cint').onchange=e=>{calInt=e.target.value;renderCal()};
}

 <div class="pod">${r.rows.filter(x=>x[0]<=3).map(x=>`<div><b>${x[0]}º</b> ${esc(x[1]+' '+x[2])}<div class="small mut">${x[3]} · ${fmt(x[5])} pts</div></div>`).join('')}</div>
 <div class="tbl"><table><thead><tr><th class="n">Pos.</th><th>Tiradora</th><th>Club</th><th>Año</th><th class="n">Puntos (coef. 1)</th></tr></thead><tbody>

// ---------- RANKING INTERNO ----------
const INT_RULES={
 Cadete:{nac:"2 mejores nacionales ×0,75 (TNR M17, TNR M20; sin arrastre)",int:"2 mejores internacionales: CM Cadete seleccionadas ×1 · CM Junior seleccionadas ×1,25 · Europeo Cadete ×1,25 · Europeo Junior ×1,5",min:"Mundial Cadete: 7.000 pts",uso:"Selección CM Cadete PFCAR (top 10), Europeo Cadete (top 3 + 1 CNTyC), Mundial Cadete"},
 Junior:{nac:"2 mejores nacionales ×0,75 (TNR M20, TNR ABS; sin arrastre)",int:"2 mejores internacionales: CM Junior seleccionadas ×1 · Circuito Europeo Sub23 seleccionado ×1,25 · Copas del Mundo y GP senior seleccionados ×2 · Europeo Junior ×1,25",min:"Mundial Junior: 7.200 pts (a 08/03/2027)",uso:"Selección CM Junior PFCAR (top 8 + 4 CNTyC), Europeo Junior (top 3 + 1), Mundial Junior"},
 Sub23:{nac:"2 mejores nacionales ×0,75 (TNR ABS; sin arrastre)",int:"2 mejores internacionales: Circuito Europeo Sub23 seleccionado ×1 · Satélites FIE en España seleccionados ×1,25 · Copas del Mundo y GP senior seleccionados ×2",min:"—",uso:"Selección Circuito Europeo Sub23 (top 4) y Europeo Sub23 (top 3 + 1 CNTyC)"}
};
const INT_NEXT={Cadete:"ECC Segovia 09/01, CM Plovdiv 21/01",Junior:"GP Orleans 03/12, CM Junior Plovdiv 21/01",Sub23:"GP Orleans 03/12"};

function intTable(r){
 const I=(typeof INT!=='undefined')&&INT[r];
 if(!I)return `<div class="note" style="margin-top:10px">La RFEE aún no ha publicado el ranking interno ${r} de sable femenino en Skermo. Hasta entonces, la referencia es el ranking nacional${r=='Sub23'?' Sub23 (estimado en la pestaña Rankings)':''}.</div>`;
 const max=I.min||Math.max(...I.rows.map(x=>x[6]));
 const q=(window._intQ||'').toLowerCase();
 return `<h3 style="margin:16px 0 6px;font-size:14px">Clasificación oficial a ${I.fecha} <a class="small" href="${I.pdf}" target="_blank" style="font-weight:400">PDF RFEE</a></h3>
 <div class="tbl"><table><thead><tr><th class="n">#</th><th>Tiradora</th><th>Club</th><th>Año</th><th class="n">Nacionales</th>${I.comps.map(c=>`<th class="n">${esc(c)}<br><span style="font-weight:400;text-transform:none">pos · pts</span></th>`).join('')}<th class="n">Total</th><th style="min-width:110px">Hacia mínimo ${I.min?fmt(I.min).replace(',00',''):''}</th></tr></thead><tbody>
 ${I.rows.map(x=>`<tr class="${x[0]==3||x[0]==10?'cut':''}" title="${x[0]==3?'Top 3: plaza directa al Europeo':x[0]==10?'Top 10: pueden inscribirse al Europeo':''}"><td class="n"><b>${x[0]}</b></td><td>${esc(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td class="n">${fmt(x[4])}</td>${x[5].map(c=>`<td class="n">${c?`<span class="mut">${c[0]}ª</span> · ${fmt(c[1])}`:'<span class="mut">—</span>'}</td>`).join('')}<td class="n"><b>${fmt(x[6])}</b></td><td><div class="bar" title="${Math.round(x[6]/max*100)}% del mínimo"><i style="width:${Math.min(100,x[6]/max*100)}%;${x[6]>=max?'background:var(--ok)':''}"></i></div></td></tr>`).join('')}
 </tbody></table></div>
 <p class="small mut">Top 20 publicado por la RFEE (orden # tal como aparece en el PDF). Línea discontinua: top 3 (Europeo) y top 10 (pueden inscribirse al Europeo). Total = nacionales (2 mejores ×0,75) + los 2 mejores resultados internacionales. Las pruebas posteriores al ${I.fecha} (p. ej. ${INT_NEXT[r]||'las próximas seleccionadas'}) se sumarán cuando la RFEE publique la actualización.</p>`;
}
function renderInterno(){
 const by=r=>EV.filter(e=>e.punt.some(p=>p[0]==r));
 $('#t-interno').innerHTML=`<div class="note" style="margin-bottom:14px">Competiciones que puntúan para los <b>rankings internos RFEE</b> de sable femenino según los Criterios de participación y selección 26-27. Estos rankings deciden la selección para Copas del Mundo, Europeos y Mundiales. El ranking Absoluto no tiene ranking interno: la selección senior usa el ranking nacional (top 20) y los resultados en Copas del Mundo/GP.</div>
 <div class="grid">${Object.entries(INT_RULES).map(([r,x])=>{const list=by(r);return `<div class="card"><h3>Ranking interno ${r}</h3>
 <div class="small"><b>Nacionales:</b> ${x.nac}<br><b>Internacionales:</b> ${x.int}<br><b>Sirve para:</b> ${x.uso}<br><b>Mínimo:</b> ${x.min}</div>
 ${intTable(r)}
 <h3 style="margin:16px 0 6px;font-size:14px">Competiciones que puntúan</h3>
 <table style="margin-top:10px"><thead><tr><th>Fecha</th><th>Competición</th><th>Lugar</th><th class="n">Factor</th><th></th></tr></thead><tbody>
 ${list.map(e=>{const p=e.punt.find(q=>q[0]==r);const dd=daysTo(e.d);return `<tr style="${dd<0?'opacity:.55':''}"><td>${e.date}</td><td>${esc(e.name)}${p[2]&&p[2]!='nacional'?` <span class="tag w" title="${esc(p[2])}">a confirmar</span>`:''}</td><td class="small">${esc(e.place)}</td><td class="n"><b>×${fx(p[1])}</b></td><td class="small ${dd<0?'mut':''}">${dd<0?'Celebrada':'en '+dd+' d'}</td></tr>`}).join('')}
 </tbody></table></div>`}).join('')}</div>
 <p class="small mut" style="margin-top:12px">(a confirmar) El documento cita SWC Atenas 19/02 y SWC Sofía 19/03 para sable femenino; en Skermo aparecen Padova 18/02 y Panagyurishte 19/03. El Circuito Europeo Sub23 y los Satélites aún no tienen pruebas de sable seleccionadas en el documento. Los Campeonatos de España también puntúan como nacionales cuando se publiquen.</p>`;
}

// ---------- CALCULADORA ----------
let cCat='M17',cComp=0,cPos=8,cN=42,cAth='';
function renderCalc(){
 const rule=RULES[cCat];if(cComp>=rule.comps.length)cComp=0;const coef=rule.comps[cComp][1];
 const p=pts(cPos,cN,coef),base=pts(cPos,cN,1);
 const bands=[1,2,3,5,8,9,16,17,32,33,64,65,128].filter(x=>x<=cN);
 const ath=RK[cCat].filter(r=>r[5]>0||cCat=='M13'||cCat=='M15');
 let sim='';
 if(cAth!==''&&ath[+cAth]&&!isNaN(p)){const a=ath[+cAth];const nt=a[5]+p;const newPos=RK[cCat].filter(r=>r!==a&&r[5]>nt).length+1;
  sim=`<div class="note" style="margin-top:10px"><b>${esc(a[1]+' '+a[2])}</b>: ${fmt(a[5])} pts (${a[0]?a[0]+'ª':'sin posición'}) → <b>${fmt(nt)} pts</b> → posición estimada <b>${newPos}ª</b> ${a[0]?`(${newPos<a[0]?'▲ sube '+(a[0]-newPos):newPos>a[0]?'▼ baja '+(newPos-a[0]):'se mantiene'})`:''}
  <div class="small mut">Estimación: suma directa sin recalcular "mejores resultados" ni movimientos de las rivales.</div></div>`}
 $('#t-calc').innerHTML=`<div class="grid g2">
 <div class="card"><h3>Calcula los puntos de una competición</h3>
  <div class="row" style="align-items:flex-end">
   <label class="f">Ranking<select id="ccat">${CATS.map(([k,l])=>`<option value="${k}" ${k==cCat?'selected':''}>${l}</option>`).join('')}</select></label>
   <label class="f">Competición (coef.)<select id="ccomp">${rule.comps.map((c,i)=>`<option value="${i}" ${i==cComp?'selected':''}>${c[0]} · ×${String(c[1]).replace('.',',')}</option>`).join('')}</select></label>
  </div>
  <div class="row" style="align-items:flex-end;margin-top:10px">
   <label class="f">Posición final<input id="cpos" type="number" min="1" value="${cPos}" style="width:110px"></label>
   <label class="f">Nº participantes<input id="cn" type="number" min="2" value="${cN}" style="width:110px"></label>
  </div>
  <div style="margin-top:16px"><div class="mut small">Puntos para el ranking ${CATNAME[cCat]}</div><div class="big">${isNaN(p)?'—':fmt(p)}</div>
  <div class="small mut">${isNaN(p)?'La posición debe estar entre 1 y el nº de participantes.':`Base ${fmt(base)} × ${String(coef).replace('.',',')} · bonus por posición ${bonus(cPos)} + 1000·(1,01 − log(${cPos})/log(${cN}))`}</div></div>
  <div style="margin-top:14px"><label class="f">Simular en el ranking actual<select id="cath"><option value="">— elige tiradora —</option>${ath.map((a,i)=>`<option value="${i}" ${String(i)===cAth?'selected':''}>${a[0]?a[0]+'. ':''}${esc(a[1]+' '+a[2])} (${fmt(a[5])})</option>`).join('')}</select></label>${sim}</div>
 </div>
 <div class="card"><h3>Tabla de puntos · ${cN} participantes · ${rule.comps[cComp][0]}</h3>
  <div class="tbl" style="max-height:420px"><table><thead><tr><th class="n">Posición</th><th>Ronda</th><th class="n">Base</th><th class="n">× ${String(coef).replace('.',',')}</th></tr></thead><tbody>
  ${bands.map(b=>`<tr ${b==cPos?'style="background:#fde8e9"':''}><td class="n">${b}</td><td class="mut small">${b==1?'Campeona':b==2?'Final':b<5?'Semifinal':b<9?'Cuartos (T8)':b<17?'T16':b<33?'T32':b<65?'T64':'T128'}</td><td class="n">${fmt(pts(b,cN))}</td><td class="n"><b>${fmt(pts(b,cN,coef))}</b></td></tr>`).join('')}
  </tbody></table></div>
  <p class="small mut">Primera y última posición de cada ronda del tablón. Saltos grandes al pasar de ronda: entrar en T32 (≤32) suma ~200 pts extra respecto a la 33ª.</p></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>Cómo se calcula (Normativa RFEE 26-27, apdo. 1.4.1)</h3>
 <p>Puntos = [ Bonus(posición) + 1000 × (1,01 − log<sub>10</sub>(posición) / log<sub>10</sub>(participantes)) ] × coeficiente</p>
 <p class="small">Bonus: 1.º 1414 · 2.º 1212 · 3.º-4.º 1010 · 5.º-8.º 808 · 9.º-16.º 606 · 17.º-32.º 404 · 33.º-64.º 202 · 65.º-128.º 101. Coeficientes: categoría propia ×1; categoría inmediatamente superior ×1,25; Cto. España propio ×1,25; Cto. España superior ×1,50. Verificado con los resultados reales: 1.ª de 42 = 2.424,00; 2.ª de 42 = 2.036,55; 3.ª de 55 en TNR M20 aplicada al ranking M17 = 1.745,85 × 1,25 = 2.182,31.</p>
 <p class="small"><b>Ranking ${CATNAME[cCat]}:</b> ${rule.best}. Arrastre de la temporada anterior: ${rule.carry}% de los puntos totales.</p></div>`;
 $('#ccat').onchange=e=>{cCat=e.target.value;cComp=0;cAth='';cN=RULES[cCat].n;renderCalc()};
 $('#ccomp').onchange=e=>{cComp=+e.target.value;const nm=RULES[cCat].comps[cComp][0];const m={"TNR M13":25,"TNR M15":34,"TNR M17":42,"TNR M20":55,"TNR Absoluto":68};if(m[nm])cN=m[nm];renderCalc()};
 const bind=(id,set)=>{const el=$(id);el.oninput=()=>{set(+el.value);renderCalc();const n=$(id);n.focus();try{n.setSelectionRange(99,99)}catch(e){}}};
 bind('#cpos',v=>cPos=v);bind('#cn',v=>cN=v);
 $('#cath').onchange=e=>{cAth=e.target.value;renderCalc()};
}

 </div>
 <p class="small mut">Resumen de "Normativa para Rankings Nacionales 26-27 V1" y "Criterios de participación y selección 26-27 V4" (RFEE, septiembre 2026). Consulta siempre el documento oficial.</p>`;

renderResumen();renderInterno();renderRanking();renderCal();renderRes();renderCalc();renderNorm();
