/* ===========================================================
   FORMULA RFEE
   =========================================================== */

function bonus(p){

  return p==1 ? 1414 :
         p==2 ? 1212 :
         p<5   ? 1010 :
         p<9   ? 808  :
         p<17  ? 606  :
         p<33  ? 404  :
         p<65  ? 202  :
         p<129 ? 101  :
         0;
}


function pts(pos,n,coef=1){

  if(
    !(pos>=1) ||
    !(n>=2) ||
    pos>n
  ){
    return NaN;
  }

  return (
    bonus(pos)
    +
    1000 * (
      1.01
      -
      Math.log10(pos)
      /
      Math.log10(n)
    )
  ) * coef;
}

/* ===========================================================
   CARGA AUTOMATICA DESDE nacional-rfee.json
   =========================================================== */

async function loadData(){

  try{

    const response =
      await fetch(
        "data/nacional-rfee.json?v="
        + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP "
        + response.status
      );

    }

    DATA =
      await response.json();


    if(
      !DATA.rankings
    ){

      throw new Error(
        "El JSON no contiene rankings"
      );

    }


    const m15 =
      DATA.rankings.M15 || [];


    const positives =
      m15.filter(
        r =>
          Number(r.points)>0
      ).length;


    if(
      m15.length===0
    ){

      throw new Error(
        "Ranking M15 vacío"
      );

    }


    if(
      positives===0
    ){

      throw new Error(
        "M15 contiene tiradoras, "
        +
        "pero todos los puntos "
        +
        "son cero"
      );

    }


    [
      "M13",
      "M15",
      "M17",
      "M20",
      "ABS"
    ].forEach(
      cat => {

        RK[cat] =
          (DATA.rankings[cat] || [])
            .map(
              r => [

                Number(
                  r.position
                )
                || null,

                String(
                  r.first_name
                  ||
                  r.full_name
                  ||
                  ""
                ),

                String(
                  r.last_name
                  ||
                  ""
                ),

                Number(
                  r.birth_year
                )
                || "",

                String(
                  r.club
                  ||
                  ""
                ),

                Number(
                  r.points
                )
                || 0

              ]
            );

      }
    );


    createSub23();


    $("#snap").textContent =
      DATA.updated_at
      +
      " · actualización automática";


    $("#status").innerHTML =
      `<div class="ok">
       Datos nacionales cargados
       correctamente desde
       <b>nacional-rfee.json</b>.
       M15:
       <b>${m15.length}</b>
       tiradoras,
       <b>${positives}</b>
       con puntuación positiva.
       </div>`;


    renderAll();

  }
  catch(error){

    $("#snap").textContent =
      "actualización no disponible";


    $("#status").innerHTML =
      `<div class="err">
       <b>No se muestran rankings
       nacionales antiguos.</b>
       ${esc(error.message)}.
       Ejecuta el workflow
       <b>Actualizar dashboard
       Nacional y Regional</b>.
       </div>`;

  }

}


/* ===========================================================
   SUB23 ESTIMADO
   =========================================================== */

function createSub23(){

  const abs =
    RK.ABS
      .filter(
        r => Number(r[3])>=2004
      )
      .map(
        r => [...r]
      )
      .sort(
        (a,b) =>
          b[5]-a[5]
      );


  let last = null;
  let pos = 0;


  abs.forEach(
    (r,i) => {

      if(
        r[5]!==last
      ){

        pos=i+1;
        last=r[5];

      }

      r[0]=pos;

    }
  );


  RK.M23=abs;

}

/* ===========================================================
   RANKINGS
   =========================================================== */

let rkCat="M15";
let rkQ="";
let rkClub="";

const CATNAME = {

M13:"M13",
M15:"M15 (Infantil)",
M17:"M17 (Cadete)",
M20:"M20 (Junior)",
M23:"Sub23",
ABS:"Absoluto"

};


function renderRanking(){

  const rows =
    RK[rkCat] || [];


  const maximum =
    Math.max(
      ...rows.map(
        r => Number(r[5]) || 0
      ),
      1
    );


  const clubs =
    [
      ...new Set(
        rows.map(
          r => r[4]
        )
        .filter(Boolean)
      )
    ].sort();


  const q =
    rkQ.toLowerCase();


  const filtered =
    rows.filter(
      r =>
        (
          !q
          ||
          (
            r[1]
            +" "
            +r[2]
          )
          .toLowerCase()
          .includes(q)
        )
        &&
        (
          !rkClub
          ||
          r[4]==rkClub
        )
    );


  const body =
    filtered.map(
      r => `

      <tr>

        <td class="n">
        <b>${r[0] ?? "—"}</b>
        </td>

        <td>
        ${esc(r[1]+" "+r[2])}
        </td>

        <td>
        ${esc(r[4])}
        </td>

        <td>
        ${r[3]}
        </td>

        <td class="n">
        ${fmt(r[5])}
        </td>

        <td>

          <div class="bar">

            <i style="
              width:
              ${
                Number(r[5])
                /
                maximum
                *
                100
              }%
            ">
            </i>

          </div>

        </td>

      </tr>

      `
    ).join("");


  $("#t-ranking").innerHTML = `

  <div class="card">

    <div class="chips">

      ${
        Object.entries(
          CATNAME
        )
        .map(
          ([k,label]) =>
            `
            <button
              class="chip
              ${k==rkCat?"on":""}"
              data-c="${k}"
            >
            ${label}
            </button>
            `
        )
        .join("")
      }

    </div>


    <div class="row"
         style="margin-bottom:10px">

      <input
        id="rkq"
        placeholder="Buscar tiradora…"
        value="${esc(rkQ)}"
      >

      <select id="rkclub">

        <option value="">
        Todos los clubes
        </option>

        ${
          clubs.map(
            c =>
              `<option
               ${c==rkClub
                 ?"selected"
                 :""}>
               ${esc(c)}
               </option>`
          ).join("")
        }

      </select>

      <span class="small mut">
      ${rows.length} tiradoras
      </span>

    </div>


    ${
      rkCat=="M23"
        ?
        `<div class="note"
              style="margin-bottom:10px">

         Sub23 estimado a partir
         del ranking Absoluto para
         nacidas en 2004 o después.

         </div>`
        :
        ""
    }


    <div class="tbl">

      <table>

        <thead>

          <tr>
            <th class="n">#</th>
            <th>Tiradora</th>
            <th>Club</th>
            <th>Año</th>
            <th class="n">
            Puntos
            </th>
            <th></th>
          </tr>

        </thead>

        <tbody>
        ${body}
        </tbody>

      </table>

    </div>


    <p class="small mut">

    Fuente:
    <a
      target="_blank"
      rel="noopener"
      href="${
        DATA.ranking_urls?.[rkCat]
        ||
        "https://app.skermo.org/ranking-rfee/public/RFEE"
      }">

    Skermo · Ranking Nacional

    </a>

    · ${esc(DATA.updated_at)}

    </p>

  </div>

  `;


  $("#t-ranking .chips")
    .onclick =
      e => {

        if(
          e.target.dataset.c
        ){

          rkCat =
            e.target.dataset.c;

          rkClub="";

          renderRanking();

        }

      };


  $("#rkq").oninput =
    e => {

      rkQ=e.target.value;

      renderRanking();

    };


  $("#rkclub").onchange =
    e => {

      rkClub=e.target.value;

      renderRanking();

    };

}

/* ===========================================================
   CALCULADORA
   =========================================================== */

let internalCategory = "M17";
let internalSearch = "";
let internalClub = "";


function internalLabel(category){

  return (
    category === "M17"
      ? "Cadete"
      : category === "M20"
        ? "Junior"
        : category
  );

}


function internalMinimum(category){

  const ranking =
    DATA
      .internal_rankings
      ?.[category];

  return Number(
    ranking?.minimum
    ||
    (
      category === "M17"
        ? 7000
        : category === "M20"
          ? 7200
          : 0
    )
  );

}


function renderInterno(){

  const rankings =
    DATA.internal_rankings
    ||
    {};


  const available =
    [
      "M17",
      "M20"
    ].filter(
      category =>
        rankings[category]
        &&
        Array.isArray(
          rankings[category].rows
        )
    );


  if(
    available.length === 0
  ){

    $("#t-interno")
      .innerHTML =
        `

        <div class="err">

          No se ha cargado todavía
          el ranking interno RFEE.

          Ejecuta el workflow

          <b>
          Actualizar dashboard
          Nacional y Regional
          </b>

          y comprueba que
          data/nacional-rfee.json
          contiene
          internal_rankings.

        </div>
        `;

    return;

  }


  if(
    !available.includes(
      internalCategory
    )
  ){

    internalCategory =
      available[0];

  }


  const current =
    rankings[
      internalCategory
    ];


  const rows =
    current.rows
    ||
    [];


  const clubs =
    [
      ...new Set(
        rows
          .map(
            row =>
              row.club
          )
          .filter(Boolean)
      )
    ]
    .sort();


  const query =
    internalSearch
      .toLowerCase();


  const filtered =
    rows.filter(
      row =>
        (
          !query
          ||
          String(
            row.full_name
            ||
            ""
          )
          .toLowerCase()
          .includes(query)
        )
        &&
        (
          !internalClub
          ||
          row.club
          ===
          internalClub
        )
    );


  const minimum =
    internalMinimum(
      internalCategory
    );


  const originalHeaders =
    Array.isArray(
      current.headers
    )
      ? current.headers
      : [];


  const detailHeaders =
    originalHeaders.filter(
      header => {

        const normalized =
          header
            .toLowerCase();

        return !(
          normalized.includes(
            "pos"
          )
          ||
          normalized.includes(
            "nombre"
          )
          ||
          normalized.includes(
            "apellido"
          )
          ||
          normalized.includes(
            "club"
          )
          ||
          normalized.includes(
            "nacimiento"
          )
          ||
          normalized.includes(
            "año"
          )
          ||
          normalized === "total"
          ||
          normalized.includes(
            "puntuación total"
          )
        );

      }
    );


  const body =
    filtered
      .map(
        row => {

          const total =
            Number(
              row.total
            )
            ||
            0;


          const progress =
            minimum > 0
              ?
              Math.min(
                100,
                total
                /
                minimum
                *
                100
              )
              :
              0;


          return `

          <tr>

            <td class="n">
            <b>
            ${row.position ?? "—"}
            </b>
            </td>


            <td>
            ${esc(row.full_name)}
            </td>


            <td>
            ${esc(row.club)}
            </td>


            <td>
            ${esc(row.birth_year)}
            </td>


            ${
              detailHeaders
                .map(
                  header =>
                    `
                    <td class="n">
                    ${
                      esc(
                        row.columns
                          ?.[header]
                        ||
                        ""
                      )
                    }
                    </td>
                    `
                )
                .join("")
            }


            <td class="n">
            <b>
            ${fmt(total)}
            </b>
            </td>


            <td>

              <div class="bar">

                <i style="
                  width:
                  ${progress}%
                ">
                </i>

              </div>

              <div class="small mut">

              ${
                minimum
                ?
                `${fmt(total)}
                 /
                 ${fmt(minimum)}`
                :
                ""
              }

              </div>

            </td>

          </tr>
          `;

        }
      )
      .join("");


  $("#t-interno")
    .innerHTML =
      `

      <div class="card">


        <div class="chips">

          ${
            available
              .map(
                category =>
                  `
                  <button
                    type="button"
                    class="chip
                    ${
                      category
                      ===
                      internalCategory
                        ? "on"
                        : ""
                    }"
                    data-internal-category="
                    ${category}
                    "
                  >

                  ${
                    internalLabel(
                      category
                    )
                  }

                  </button>
                  `
              )
              .join("")
          }

        </div>


        <div class="row"
             style="
             margin-bottom:10px
             ">


          <input
            id="internalSearch"
            placeholder="
            Buscar tiradora…
            "
            value="${
              esc(
                internalSearch
              )
            }"
          >


          <select
            id="internalClub"
          >

            <option value="">
            Todos los clubes
            </option>

            ${
              clubs
                .map(
                  club =>
                    `
                    <option
                      value="${esc(club)}"
                      ${
                        club
                        ===
                        internalClub
                          ? "selected"
                          : ""
                      }
                    >

                    ${esc(club)}

                    </option>
                    `
                )
                .join("")
            }

          </select>


          <span class="small mut">

          ${
            filtered.length
          }

          tiradoras

          </span>

        </div>


        <div class="ok">

          <b>
          ${
            esc(
              current.name
              ||
              (
                "Ranking interno "
                +
                internalLabel(
                  internalCategory
                )
              )
            )
          }
          </b>

          · Fecha de referencia:

          <b>
          ${
            esc(
              current
                .reference_date
              ||
              DATA
                .internal_rankings_updated_at
              ||
              "sin fecha"
            )
          }
          </b>

          · Mínimo de referencia:

          <b>
          ${fmt(minimum)}
          puntos
          </b>

        </div>


        <div class="tbl"
             style="margin-top:12px">


          <table>


            <thead>

              <tr>

                <th class="n">
                #
                </th>

                <th>
                Tiradora
                </th>

                <th>
                Club
                </th>

                <th>
                Año
                </th>

                ${
                  detailHeaders
                    .map(
                      header =>
                        `
                        <th class="n">
                        ${esc(header)}
                        </th>
                        `
                    )
                    .join("")
                }

                <th class="n">
                Total
                </th>

                <th>
                Progreso
                </th>

              </tr>

            </thead>


            <tbody>
            ${body}
            </tbody>


          </table>


        </div>


        <p class="small mut">

        Fuente:

        <a
          href="${
            esc(
              current.source_url
              ||
              "https://app.skermo.org/classification/public/RFEE?setLang=es"
            )
          }"
          target="_blank"
          rel="noopener"
        >

        Skermo RFEE ·
        Clasificaciones

        </a>

        </p>


      </div>
      `;


  $("#t-interno .chips")
    .onclick =
      event => {

        const category =
          event
            .target
            .dataset
            .internalCategory;


        if(!category){
          return;
        }


        internalCategory =
          category;


        internalSearch =
          "";


        internalClub =
          "";


        renderInterno();

      };


  $("#internalSearch")
    .oninput =
      event => {

        internalSearch =
          event.target.value;

        renderInterno();

      };


  $("#internalClub")
    .onchange =
      event => {

        internalClub =
          event.target.value;

        renderInterno();

      };

}
