<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>
<title>
Sable femenino · Nacional RFEE
</title>

<style>
:root {
  --nav:#315f9d;
  --bg:#f4f6fa;
  --card:#fff;
  --line:#dce2ec;
  --text:#172033;
  --mut:#65718a;
  --red:#bf2c32;
  --blue:#244d84;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font:
    14px/1.45
    system-ui,
    Segoe UI,
    Arial;
  background:var(--bg);
  color:var(--text);
}

header {
  background:var(--nav);
  color:#fff;
  padding:18px 20px 0;
}

h1 {
  font-size:21px;
  margin:0 0 4px;
}

.sub {
  font-size:12px;
  margin-bottom:16px;
}

nav {
  display:flex;
  flex-wrap:wrap;
}

nav button {
  border:0;
  background:none;
  color:#eef4ff;
  padding:12px 15px;
  font-weight:700;
  cursor:pointer;
}

nav button.on {
  background:#fff;
  color:var(--blue);
  border-radius:9px 9px 0 0;
}

main {
  max-width:1180px;
  margin:auto;
  padding:18px;
}

.hide {
  display:none;
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
}

.grid4 {
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:14px;
}

.kicker {
  font-size:12px;
  color:var(--mut);
  text-transform:uppercase;
}

.big {
  font-size:22px;
  font-weight:800;
  margin:5px 0;
}

.mut {
  color:var(--mut);
}

.cats,
.row {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
  margin:10px 0;
}

.cats button {
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 13px;
  cursor:pointer;
}

.cats button.on {
  background:var(--blue);
  color:#fff;
}

input,
select {
  font:inherit;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
}

.tbl {
  max-height:580px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

th,
td {
  padding:9px 10px;
  border-bottom:
    1px solid var(--line);
  text-align:left;
}

th {
  font-size:12px;
  color:var(--mut);
  background:#fafbfd;
  position:sticky;
  top:0;
}

td.num,
th.num {
  text-align:right;
}

.bar {
  display:inline-block;
  height:6px;
  background:var(--red);
  border-radius:9px;
  margin-left:8px;
  vertical-align:middle;
}

.tag {
  display:inline-block;
  font-size:11px;
  padding:2px 7px;
  border-radius:999px;
  background:#edf2f9;
  color:var(--blue);
  font-weight:600;
}

.ok {
  background:#eefaf4;
  border:1px solid #bfe5d0;
  color:#17613f;
  border-radius:10px;
  padding:11px;
  margin-bottom:14px;
}

.error {
  background:#fff1f1;
  border:1px solid #efc3c3;
  color:#971b1b;
  border-radius:10px;
  padding:13px;
  margin-bottom:14px;
}

a {
  color:var(--blue);
}

@media(max-width:850px) {
  .grid4 {
    grid-template-columns:1fr;
  }

  main {
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
<h1>
Sable femenino · Temporada 2026-27
</h1>

<div class="sub">
Ranking Nacional RFEE ·
Sable femenino ·
<span id="snapshot">
Cargando datos actuales…
</span>
</div>

<nav id="nav"></nav>
</header>

<main>

<div id="globalError"></div>

<section id="tab-resumen">
</section>

<section
  id="tab-rankings"
  class="hide">
</section>

<section
  id="tab-calendario"
  class="hide">
</section>

<section
  id="tab-fuentes"
  class="hide">
</section>

</main>

<script>
(() => {

"use strict";

const $ =
  selector =>
    document.querySelector(
      selector
    );

const esc =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        })[character]
      );


const tabs = [
  [
    "resumen",
    "Resumen"
  ],
  [
    "rankings",
    "Rankings"
  ],
  [
    "calendario",
    "Calendario"
  ],
  [
    "fuentes",
    "Fuentes"
  ]
];


let data = null;
let category = "M15";


$("#nav").innerHTML =
  tabs
    .map(
      ([key,label],index) =>
        `
        <button
          type="button"
          data-tab="${key}"
          class="${index ? "" : "on"}"
        >
          ${label}
        </button>
        `
    )
    .join("");


$("#nav").addEventListener(
  "click",
  event => {

    const tab =
      event.target.dataset.tab;

    if (!tab) {
      return;
    }

    $("#nav")
      .querySelectorAll(
        "button"
      )
      .forEach(
        button =>
          button.classList.toggle(
            "on",
            button.dataset.tab === tab
          )
      );

    tabs.forEach(
      ([key]) => {

        $("#tab-" + key)
          .classList.toggle(
            "hide",
            key !== tab
          );

      }
    );

  }
);


fetch(
  "data/nacional-rfee.json?v="
  + Date.now(),
  {
    cache:"no-store"
  }
)
.then(
  response => {

    if (!response.ok) {
      throw new Error(
        "HTTP "
        + response.status
      );
    }

    return response.json();

  }
)
.then(
  json => {

    if (
      !json.validation
      ||
      json.validation
        .M15_positive_points
        < 1
    ) {

      throw new Error(
        "El JSON nacional "
        + "no contiene puntos "
        + "positivos en M15"
      );

    }

    data = json;

    $("#snapshot")
      .textContent =
        "Actualizado "
        + json.updated_at;

    renderAll();

  }
)
.catch(
  error => {

    $("#snapshot")
      .textContent =
        "actualización no disponible";

    $("#globalError")
      .innerHTML =
        `
        <div class="error">
          <b>
          No se muestran datos
          nacionales antiguos.
          </b>

          ${esc(error.message)}.

          Ejecuta el workflow
          "Actualizar dashboard
          Nacional y Regional"
          y revisa
          data/nacional-rfee.json.
        </div>
        `;

  }
);


function categoryLabel(
  value
) {

  return (
    value === "ABS"
      ? "Absoluto"
      : value
  );

}


function dateValue(
  date
) {

  const match =
    String(date ?? "")
      .match(
        /(\d{2})\/(\d{2})\/(\d{4})/
      );

  if (!match) {
    return null;
  }

  return new Date(
    Number(match[3]),
    Number(match[2]) - 1,
    Number(match[1])
  );

}


function renderAll() {

  renderSummary();

  renderRanking();

  renderCalendar();

  renderSources();

}


function renderSummary() {

  const categories = [
    "M13",
    "M15",
    "M17",
    "M20",
    "ABS"
  ];

  const total =
    Object.values(
      data.rankings
    )
    .reduce(
      (sum,rows) =>
        sum + rows.length,
      0
    );


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  const upcoming =
    (data.calendar || [])
      .filter(
        event => {

          const date =
            dateValue(
              event.date
            );

          return (
            date
            &&
            date >= today
          );

        }
      );


  $("#tab-resumen")
    .innerHTML =
      `

      <div class="ok">

        Datos RFEE actualizados:
        <b>
        ${esc(data.updated_at)}
        </b>

        · M15:

        <b>
        ${
          data.validation
            .M15_positive_points
        }
        </b>

        tiradoras con
        puntuación positiva.

      </div>


      <div class="grid4">

        <div class="card">

          <div class="kicker">
          Próxima nacional
          </div>

          <div class="big">
          ${
            esc(
              upcoming[0]
                ?.name
                ||
              "Pendiente"
            )
          }
          </div>

          <div class="mut">
          ${
            esc(
              upcoming[0]
                ?.date
                ||
              "Sin fecha"
            )
          }
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Categorías
          </div>

          <div class="big">
          5
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Tiradoras
          </div>

          <div class="big">
          ${total}
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Pruebas calendario
          </div>

          <div class="big">
          ${
            (data.calendar || [])
              .length
          }
          </div>

        </div>

      </div>


      <div class="card">

        <h3>
        Líderes del ranking nacional
        </h3>

        <table>

          <tr>
            <th>Categoría</th>
            <th>Tiradora</th>
            <th>Club</th>
            <th>Puntos</th>
          </tr>

          ${
            categories
              .map(
                cat => {

                  const row =
                    data
                      .rankings[cat]
                      ?.[0];

                  return `
                  <tr>

                    <td>
                    <b>
                    ${
                      categoryLabel(cat)
                    }
                    </b>
                    </td>

                    <td>
                    ${
                      esc(
                        row
                          ?.full_name
                          ||
                        "Sin datos"
                      )
                    }
                    </td>

                    <td>
                    ${
                      esc(
                        row
                          ?.club
                          ||
                        ""
                      )
                    }
                    </td>

                    <td>
                    ${
                      row
                        ? Number(
                            row.points
                          )
                          .toLocaleString(
                            "es-ES",
                            {
                              minimumFractionDigits:2
                            }
                          )
                        : "—"
                    }
                    </td>

                  </tr>
                  `;

                }
              )
              .join("")
          }

        </table>

      </div>
      `;

}


function renderRanking() {

  const categories = [
    "M13",
    "M15",
    "M17",
    "M20",
    "ABS"
  ];


  $("#tab-rankings")
    .innerHTML =
      `

      <div class="card">

        <div class="cats">

          ${
            categories
              .map(
                cat => `
                <button
                  type="button"
                  data-category="${cat}"
                  class="${
                    cat === category
                      ? "on"
                      : ""
                  }"
                >
                  ${
                    categoryLabel(
                      cat
                    )
                  }
                </button>
                `
              )
              .join("")
          }

        </div>


        <div class="row">

          <input
            id="rankingSearch"
            placeholder="Buscar tiradora…"
          >

          <select id="clubFilter">

            <option value="">
            Todos los clubes
            </option>

          </select>

          <span
            id="rankingCount"
            class="mut">
          </span>

        </div>


        <div id="rankingBody">
        </div>

      </div>
      `;


  document
    .querySelector(".cats")
    .addEventListener(
      "click",
      event => {

        const next =
          event
            .target
            .dataset
            .category;

        if (!next) {
          return;
        }

        category = next;

        renderRanking();

      }
    );


  const clubs =
    [
      ...new Set(
        (
          data.rankings[
            category
          ]
          ||
          []
        )
        .map(
          row => row.club
        )
        .filter(Boolean)
      )
    ]
    .sort();


  $("#clubFilter")
    .innerHTML +=
      clubs
        .map(
          club =>
            `
            <option>
            ${esc(club)}
            </option>
            `
        )
        .join("");


  $("#rankingSearch")
    .addEventListener(
      "input",
      drawRanking
    );


  $("#clubFilter")
    .addEventListener(
      "change",
      drawRanking
    );


  drawRanking();

}


function drawRanking() {

  let rows =
    data.rankings[
      category
    ]
    ||
    [];


  const search =
    $("#rankingSearch")
      .value
      .toUpperCase();


  const club =
    $("#clubFilter")
      .value;


  rows =
    rows.filter(
      row =>

        (
          !search
          ||
          row
            .full_name
            .toUpperCase()
            .includes(search)
        )

        &&

        (
          !club
          ||
          row.club === club
        )

    );


  const maximum =
    Math.max(
      1,
      ...rows.map(
        row =>
          Number(
            row.points
          )
          ||
          0
      )
    );


  $("#rankingCount")
    .textContent =
      rows.length
      + " tiradoras";


  $("#rankingBody")
    .innerHTML =
      `

      <div class="tbl">

        <table>

          <tr>
            <th>#</th>
            <th>Tiradora</th>
            <th>Club</th>
            <th>Año</th>
            <th class="num">
            Puntos
            </th>
          </tr>

          ${
            rows
              .map(
                row => {

                  const points =
                    Number(
                      row.points
                    )
                    ||
                    0;

                  const width =
                    Math.round(
                      120
                      *
                      points
                      /
                      maximum
                    );

                  return `
                  <tr>

                    <td>
                    <b>
                    ${row.position}
                    </b>
                    </td>

                    <td>
                    ${
                      esc(
                        row.full_name
                      )
                    }
                    </td>

                    <td>
                    ${
                      esc(
                        row.club
                      )
                    }
                    </td>

                    <td>
                    ${
                      esc(
                        row.birth_year
                      )
                    }
                    </td>

                    <td class="num">

                    ${
                      points
                        .toLocaleString(
                          "es-ES",
                          {
                            minimumFractionDigits:2,
                            maximumFractionDigits:2
                          }
                        )
                    }

                    <span
                      class="bar"
                      style="
                      width:${width}px
                      ">
                    </span>

                    </td>

                  </tr>
                  `;

                }
              )
              .join("")
          }

        </table>

      </div>
      `;

}


function renderCalendar() {

  $("#tab-calendario")
    .innerHTML =
      `

      <div class="card">

        <h3>
        Calendario RFEE
        </h3>

        <div class="tbl">

          <table>

            <tr>
              <th>Fecha</th>
              <th>Competición</th>
              <th>Categoría</th>
              <th>Lugar</th>
            </tr>

            ${
              (data.calendar || [])
                .map(
                  event =>
                    `
                    <tr>

                      <td>
                      ${
                        esc(
                          event.date
                        )
                      }
                      </td>

                      <td>
                      ${
                        esc(
                          event.name
                        )
                      }
                      </td>

                      <td>

                      <span
                        class="tag">

                        ${
                          esc(
                            event.category
                          )
                        }

                      </span>

                      </td>

                      <td>
                      ${
                        esc(
                          event.location
                        )
                      }
                      </td>

                    </tr>
                    `
                )
                .join("")
            }

          </table>

        </div>

      </div>
      `;

}


function renderSources() {

  $("#tab-fuentes")
    .innerHTML =
      `

      <div class="card">

        <h3>
        Fuentes
        </h3>

        ${
          (data.sources || [])
            .map(
              source =>
                `
                <p>

                  <a
                    href="${
                      esc(
                        source.url
                      )
                    }"
                    target="_blank"
                    rel="noopener"
                  >

                    ${
                      esc(
                        source.name
                      )
                    }

                  </a>

                </p>
                `
            )
            .join("")
        }

      </div>
      `;

}

})();
</script>

</body>
</html>
