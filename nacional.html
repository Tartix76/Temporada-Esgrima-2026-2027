<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Sable femenino · Nacional RFEE
</title>

<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff;
  --ink:#1b2333;
  --mut:#667085;
  --line:#e4e7ee;
  --red:#b4232c;
  --blue:#1f3a68;
  --blue2:#315f9d;
  --green:#17643d;
  --green-bg:#e9f7ef;
  --yellow:#8a5a00;
  --yellow-bg:#fff8e6;
  --error:#9b2020;
  --error-bg:#fff0f0;
  --chip:#eef1f7;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font:
    14px/1.45
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--ink);
}

header{
  background:
    linear-gradient(
      120deg,
      var(--blue),
      var(--blue2)
    );
  color:#fff;
  padding:18px 22px 0;
}

header h1{
  margin:0;
  font-size:21px;
}

.subtitle{
  margin-top:4px;
  font-size:13px;
  color:#e9eff8;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:14px;
}

nav button{
  border:0;
  background:transparent;
  color:#e4eaf5;
  padding:10px 14px;
  border-radius:8px 8px 0 0;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

nav button.on{
  background:var(--bg);
  color:var(--blue);
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px 22px 40px;
}

.hide{
  display:none;
}

.grid{
  display:grid;
  gap:14px;
}

.grid-4{
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(210px,1fr)
    );
}

.grid-2{
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(330px,1fr)
    );
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
}

.card h3{
  margin:0 0 10px;
  font-size:16px;
}

.kicker{
  color:var(--mut);
  font-size:12px;
  text-transform:uppercase;
}

.value{
  font-size:24px;
  font-weight:800;
  margin:4px 0;
}

.muted{
  color:var(--mut);
}

.small{
  font-size:12px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.tabs button{
  border:1px solid var(--line);
  background:#fff;
  padding:7px 13px;
  border-radius:999px;
  cursor:pointer;
  font:inherit;
}

.tabs button.on{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin:10px 0;
}

input,
select{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  font:inherit;
  background:#fff;
}

.table-wrap{
  max-height:580px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}

th{
  position:sticky;
  top:0;
  z-index:1;
  background:#fafbfd;
  color:var(--mut);
  font-size:12px;
}

.number{
  text-align:right;
  font-variant-numeric:
    tabular-nums;
}

.progress{
  min-width:90px;
  height:7px;
  overflow:hidden;
  background:#e9edf4;
  border-radius:999px;
}

.progress span{
  display:block;
  height:100%;
  width:0;
  background:var(--red);
}

.tag{
  display:inline-block;
  padding:2px 7px;
  border-radius:999px;
  background:var(--chip);
  color:var(--blue);
  font-size:11px;
  font-weight:700;
}

.success{
  padding:11px 13px;
  margin-bottom:14px;
  border:1px solid #bde1ca;
  border-radius:10px;
  background:var(--green-bg);
  color:var(--green);
}

.warning{
  padding:11px 13px;
  margin-bottom:14px;
  border:1px solid #f1dfb0;
  border-radius:10px;
  background:var(--yellow-bg);
  color:var(--yellow);
}

.error{
  padding:11px 13px;
  margin-bottom:14px;
  border:1px solid #efc4c4;
  border-radius:10px;
  background:var(--error-bg);
  color:var(--error);
}

.result{
  padding:14px;
  border:1px solid #cadcf5;
  border-radius:10px;
  background:#eef5ff;
}

.result strong{
  display:block;
  font-size:30px;
  color:var(--blue);
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
  color:var(--mut);
  font-size:12px;
  font-weight:700;
}

.link{
  color:var(--blue);
}

@media(max-width:760px){
  main{
    padding:12px;
  }

  nav button{
    padding:9px 8px;
  }

  .controls input{
    width:100%;
  }
}
</style>
</head>

<body>

<header>

<h1>
Sable femenino · Temporada 2026-27
</h1>

<div class="subtitle">
Rankings nacionales RFEE ·
Calendario · Resultados ·
Ranking interno ·
<span id="snapshot">
cargando datos…
</span>
</div>

<nav id="mainNav"></nav>

</header>

<main>

<div id="globalStatus"></div>

<section id="view-summary"></section>

<section
  id="view-rankings"
  class="hide">
</section>

<section
  id="view-calendar"
  class="hide">
</section>

<section
  id="view-results"
  class="hide">
</section>

<section
  id="view-internal"
  class="hide">
</section>

<section
  id="view-calculator"
  class="hide">
</section>

<section
  id="view-rules"
  class="hide">
</section>

<section
  id="view-sources"
  class="hide">
</section>

</main>

<script>
(() => {

"use strict";


const $ =
  selector =>
    document.querySelector(
      selector
    );


const escapeHtml =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        })[character]
      );


const formatNumber =
  value =>
    Number(value || 0)
      .toLocaleString(
        "es-ES",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );


const parseDate =
  value => {

    const match =
      String(value || "")
        .match(
          /(\d{2})\/(\d{2})\/(\d{4})/
        );

    if(!match){
      return null;
    }

    return new Date(
      Number(match[3]),
      Number(match[2]) - 1,
      Number(match[1])
    );

  };


const today =
  new Date();

today.setHours(
  0,
  0,
  0,
  0
);


/* =========================================================
   ESTADO GENERAL
   ========================================================= */

let DATA = null;

let nationalCategory =
  "M15";

let nationalSearch =
  "";

let nationalClub =
  "";

let internalCategory =
  "M17";

let internalSearch =
  "";

let internalClub =
  "";


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

const VIEWS = [

  [
    "summary",
    "Resumen"
  ],

  [
    "rankings",
    "Rankings"
  ],

  [
    "calendar",
    "Calendario"
  ],

  [
    "results",
    "Resultados"
  ],

  [
    "internal",
    "Ranking interno"
  ],

  [
    "calculator",
    "Calculadora de puntos"
  ],

  [
    "rules",
    "Normativa"
  ],

  [
    "sources",
    "Fuentes"
  ]

];


$("#mainNav").innerHTML =
  VIEWS
    .map(
      ([key,label],index) =>
        `
        <button
          type="button"
          data-view="${key}"
          class="${index ? "" : "on"}"
        >
          ${label}
        </button>
        `
    )
    .join("");


$("#mainNav")
  .addEventListener(
    "click",
    event => {

      const selected =
        event
          .target
          .dataset
          .view;

      if(!selected){
        return;
      }

      $("#mainNav")
        .querySelectorAll(
          "button"
        )
        .forEach(
          button => {

            button
              .classList
              .toggle(
                "on",
                button
                  .dataset
                  .view
                ===
                selected
              );

          }
        );

      VIEWS.forEach(
        ([key]) => {

          $("#view-" + key)
            .classList
            .toggle(
              "hide",
              key !== selected
            );

        }
      );

    }
  );


/* =========================================================
   CARGA DEL JSON
   ========================================================= */

fetch(
  "data/nacional-rfee.json?v="
  + Date.now(),
  {
    cache:"no-store"
  }
)
.then(
  response => {

    if(!response.ok){

      throw new Error(
        "HTTP "
        + response.status
      );

    }

    return response.json();

  }
)
.then(
  json => {

    const rankings =
      json.rankings || {};

    const m15 =
      rankings.M15 || [];

    const positiveM15 =
      m15.filter(
        row =>
          Number(
            row.points
          )
          >
          0
      ).length;

    if(m15.length === 0){

      throw new Error(
        "El ranking M15 está vacío"
      );

    }

    if(positiveM15 === 0){

      throw new Error(
        "El ranking M15 no contiene "
        + "puntuaciones positivas"
      );

    }

    DATA = json;

    $("#snapshot")
      .textContent =
        "actualizado "
        +
        (
          DATA.updated_at
          ||
          "sin fecha"
        );

    $("#globalStatus")
      .innerHTML =
        `
        <div class="success">

        Datos nacionales cargados.

        M15:

        <b>
        ${m15.length}
        </b>

        tiradoras,

        <b>
        ${positiveM15}
        </b>

        con puntuación positiva.

        </div>
        `;

    renderAll();

  }
)
.catch(
  error => {

    $("#snapshot")
      .textContent =
        "actualización no disponible";

    $("#globalStatus")
      .innerHTML =
        `
        <div class="error">

        <b>
        No se muestran datos
        nacionales antiguos.
        </b>

        ${escapeHtml(error.message)}.

        Ejecuta el workflow
        “Actualizar dashboard
        Nacional y Regional”.

        </div>
        `;

  }
);


/* =========================================================
   UTILIDADES
   ========================================================= */

function categoryName(
  category
){

  return (
    category === "ABS"
      ? "Absoluto"
      : category === "M17"
        ? "M17 Cadete"
        : category === "M20"
          ? "M20 Junior"
          : category
  );

}


function fullName(
  row
){

  return (
    row.full_name
    ||
    (
      (
        row.first_name
        ||
        ""
      )
      +
      " "
      +
      (
        row.last_name
        ||
        ""
      )
    )
  ).trim();

}


/* =========================================================
   RESUMEN
   ========================================================= */

function renderSummary(){

  const rankings =
    DATA.rankings || {};

  const categories =
    [
      "M13",
      "M15",
      "M17",
      "M20",
      "ABS"
    ];

  const total =
    Object
      .values(rankings)
      .reduce(
        (sum,rows) =>
          sum
          +
          (
            Array.isArray(rows)
              ? rows.length
              : 0
          ),
        0
      );

  const upcoming =
    (DATA.calendar || [])
      .filter(
        event => {

          const date =
            parseDate(
              event.date
            );

          return (
            date
            &&
            date >= today
          );

        }
      );

  const internal =
    DATA.internal_rankings || {};

  const internalAvailable =
    [
      "M17",
      "M20"
    ]
    .filter(
      category =>
        internal[category]
        &&
        Array.isArray(
          internal[category].rows
        )
        &&
        internal[category]
          .rows.length > 0
    );

  $("#view-summary")
    .innerHTML =
      `

      <div class="grid grid-4">

        <div class="card">

          <div class="kicker">
          Próxima nacional
          </div>

          <div class="value">
          ${
            escapeHtml(
              upcoming[0]
                ?.name
              ||
              "Pendiente"
            )
          }
          </div>

          <div class="muted">
          ${
            escapeHtml(
              upcoming[0]
                ?.date
              ||
              "Sin fecha"
            )
          }
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Tiradoras
          </div>

          <div class="value">
          ${total}
          </div>

          <div class="muted">
          Rankings nacionales
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Rankings internos
          </div>

          <div class="value">
          ${internalAvailable.length}
          </div>

          <div class="muted">
          ${
            internalAvailable.length
              ?
              internalAvailable
                .map(categoryName)
                .join(" · ")
              :
              "Pendiente"
          }
          </div>

        </div>


        <div class="card">

          <div class="kicker">
          Actualización
          </div>

          <div class="value">
          RFEE
          </div>

          <div class="muted">
          ${
            escapeHtml(
              DATA.updated_at
              ||
              "sin fecha"
            )
          }
          </div>

        </div>

      </div>


      <div class="card">

        <h3>
        Líderes del ranking nacional
        </h3>

        <table>

          <thead>

            <tr>
              <th>Categoría</th>
              <th>Tiradora</th>
              <th>Club</th>
              <th class="number">
              Puntos
              </th>
            </tr>

          </thead>

          <tbody>

          ${
            categories
              .map(
                category => {

                  const row =
                    rankings[
                      category
                    ]?.[0];

                  return `
                  <tr>

                    <td>
                    <b>
                    ${categoryName(category)}
                    </b>
                    </td>

                    <td>
                    ${
                      row
                        ?
                        escapeHtml(
                          fullName(row)
                        )
                        :
                        "Sin datos"
                    }
                    </td>

                    <td>
                    ${
                      escapeHtml(
                        row?.club || ""
                      )
                    }
                    </td>

                    <td class="number">
                    ${
                      row
                        ?
                        formatNumber(
                          row.points
                        )
                        :
                        "—"
                    }
                    </td>

                  </tr>
                  `;

                }
              )
              .join("")
          }

          </tbody>

        </table>

      </div>
      `;

}


/* =========================================================
   RANKINGS NACIONALES
   ========================================================= */

function renderNationalRankings(){

  const categories =
    [
      "M13",
      "M15",
      "M17",
      "M20",
      "ABS"
    ];

  const rankings =
    DATA.rankings || {};

  const rows =
    rankings[
      nationalCategory
    ]
    ||
    [];

  const clubs =
    [
      ...new Set(
        rows
          .map(
            row => row.club
          )
          .filter(Boolean)
      )
    ]
    .sort();

  const query =
    nationalSearch
      .toLowerCase();

  const filtered =
    rows.filter(
      row =>
        (
          !query
          ||
          fullName(row)
            .toLowerCase()
            .includes(query)
        )
        &&
        (
          !nationalClub
          ||
          row.club === nationalClub
        )
    );

  const maximum =
    Math.max(
      1,
      ...rows.map(
        row =>
          Number(
            row.points
          )
          ||
          0
      )
    );

  $("#view-rankings")
    .innerHTML =
      `

      <div class="card">

        <div class="tabs">

        ${
          categories
            .map(
              category =>
                `
                <button
                  type="button"
                  data-category="${category}"
                  class="${
                    category
                    ===
                    nationalCategory
                      ? "on"
                      : ""
                  }"
                >
                ${categoryName(category)}
                </button>
                `
            )
            .join("")
        }

        </div>


        <div class="controls">

          <input
            id="nationalSearch"
            placeholder="Buscar tiradora…"
            value="${
              escapeHtml(
                nationalSearch
              )
            }"
          >

          <select
            id="nationalClub"
          >

            <option value="">
            Todos los clubes
            </option>

            ${
              clubs
                .map(
                  club =>
                    `
                    <option
                      value="${
                        escapeHtml(club)
                      }"
                      ${
                        club
                        ===
                        nationalClub
                          ? "selected"
                          : ""
                      }
                    >
                    ${escapeHtml(club)}
                    </option>
                    `
                )
                .join("")
            }

          </select>

          <span class="small muted">
          ${filtered.length}
          tiradoras
          </span>

        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th class="number">#</th>
                <th>Tiradora</th>
                <th>Club</th>
                <th>Año</th>
                <th class="number">
                Puntos
                </th>
                <th>Progreso</th>
              </tr>

            </thead>

            <tbody>

            ${
              filtered
                .map(
                  row => {

                    const points =
                      Number(
                        row.points
                      )
                      ||
                      0;

                    const width =
                      Math.min(
                        100,
                        points
                        /
                        maximum
                        *
                        100
                      );

                    return `
                    <tr>

                      <td class="number">
                      <b>
                      ${row.position ?? "—"}
                      </b>
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          fullName(row)
                        )
                      }
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          row.club || ""
                        )
                      }
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          row.birth_year || ""
                        )
                      }
                      </td>

                      <td class="number">
                      ${
                        formatNumber(
                          points
                        )
                      }
                      </td>

                      <td>

                        <div class="progress">

                          <span
                            style="
                            width:${width}%
                            ">
                          </span>

                        </div>

                      </td>

                    </tr>
                    `;

                  }
                )
                .join("")
            }

            </tbody>

          </table>

        </div>


        <p class="small muted">

        Fuente:

        <a
          class="link"
          href="${
            escapeHtml(
              DATA
                .ranking_urls
                ?.[nationalCategory]
              ||
              "https://app.skermo.org/ranking-rfee/public/RFEE"
            )
          }"
          target="_blank"
          rel="noopener"
        >

        Skermo RFEE ·
        Ranking Nacional

        </a>

        </p>

      </div>
      `;

  $("#view-rankings .tabs")
    .onclick =
      event => {

        const selected =
          event
            .target
            .dataset
            .category;

        if(!selected){
          return;
        }

        nationalCategory =
          selected;

        nationalSearch =
          "";

        nationalClub =
          "";

        renderNationalRankings();

      };

  $("#nationalSearch")
    .oninput =
      event => {

        nationalSearch =
          event.target.value;

        renderNationalRankings();

      };

  $("#nationalClub")
    .onchange =
      event => {

        nationalClub =
          event.target.value;

        renderNationalRankings();

      };

}


/* =========================================================
   CALENDARIO
   ========================================================= */

function renderCalendar(){

  const events =
    DATA.calendar || [];

  $("#view-calendar")
    .innerHTML =
      `

      <div class="card">

        <h3>
        Calendario RFEE ·
        Sable femenino
        </h3>

        ${
          events.length
            ?
            `
            <div class="table-wrap">

              <table>

                <thead>

                  <tr>
                    <th>Fecha</th>
                    <th>Competición</th>
                    <th>Categoría</th>
                    <th>Lugar</th>
                  </tr>

                </thead>

                <tbody>

                ${
                  events
                    .map(
                      event =>
                        `
                        <tr>

                          <td>
                          ${
                            escapeHtml(
                              event.date
                            )
                          }
                          </td>

                          <td>
                          ${
                            escapeHtml(
                              event.name
                            )
                          }
                          </td>

                          <td>
                          <span class="tag">
                          ${
                            escapeHtml(
                              event.category
                            )
                          }
                          </span>
                          </td>

                          <td>
                          ${
                            escapeHtml(
                              event.location
                              ||
                              ""
                            )
                          }
                          </td>

                        </tr>
                        `
                    )
                    .join("")
                }

                </tbody>

              </table>

            </div>
            `
            :
            `
            <div class="warning">
            No hay pruebas nacionales
            cargadas en el JSON.
            </div>
            `
        }

      </div>
      `;

}


/* =========================================================
   RESULTADOS
   ========================================================= */

function renderResults(){

  const results =
    DATA.results || [];

  $("#view-results")
    .innerHTML =
      `

      <div class="card">

        <h3>
        Resultados nacionales
        </h3>

        ${
          results.length
            ?
            results
              .map(
                result =>
                  `
                  <div
                    style="
                    padding:11px 0;
                    border-bottom:
                    1px solid var(--line);
                    "
                  >

                  <b>
                  ${
                    escapeHtml(
                      result.name
                    )
                  }
                  </b>

                  ·
                  ${
                    escapeHtml(
                      result.date || ""
                    )
                  }

                  ·
                  ${
                    escapeHtml(
                      result.category || ""
                    )
                  }

                  </div>
                  `
              )
              .join("")
            :
            `
            <div class="warning">

            Los resultados detallados

/* =========================================================
   RANKING INTERNO
   ========================================================= */

function internalName(
  category
){

  return (
    category === "M17"
      ? "Cadete"
      : category === "M20"
        ? "Junior"
        : category
  );

}


function minimumForInternal(
  category
){

  const configured =
    DATA
      .internal_rankings
      ?.[category]
      ?.minimum;

  if(configured){
    return Number(configured);
  }

  return (
    category === "M17"
      ? 7000
      : category === "M20"
        ? 7200
        : 0
  );

}


function renderInternalRanking(){

  const rankings =
    DATA.internal_rankings
    ||
    {};

  const available =
    [
      "M17",
      "M20"
    ]
    .filter(
      category =>
        rankings[category]
        &&
        Array.isArray(
          rankings[category].rows
        )
        &&
        rankings[category]
          .rows.length > 0
    );

  if(available.length === 0){

    $("#view-internal")
      .innerHTML =
        `

        <div class="warning">

        El ranking interno todavía
        no está disponible en
        nacional-rfee.json.

        El resto del dashboard puede
        actualizarse con normalidad.

        Ejecuta el workflow y revisa
        el paso:

        <b>
        Actualizar ranking interno RFEE
        </b>.

        </div>
        `;

    return;
  }

  if(
    !available.includes(
      internalCategory
    )
  ){
    internalCategory =
      available[0];
  }

  const current =
    rankings[
      internalCategory
    ];

  const rows =
    current.rows || [];

  const query =
    internalSearch
      .toLowerCase();

  const clubs =
    [
      ...new Set(
        rows
          .map(
            row => row.club
          )
          .filter(Boolean)
      )
    ]
    .sort();

  const filtered =
    rows.filter(
      row =>
        (
          !query
          ||
          String(
            row.full_name
            ||
            ""
          )
          .toLowerCase()
          .includes(query)
        )
        &&
        (
          !internalClub
          ||
          row.club === internalClub
        )
    );

  const minimum =
    minimumForInternal(
      internalCategory
    );

  const sourceHeaders =
    Array.isArray(
      current.headers
    )
      ? current.headers
      : [];

  const detailHeaders =
    sourceHeaders.filter(
      header => {

        const value =
          String(header)
            .toLowerCase();

        return !(
          value.includes("pos")
          ||
          value.includes("nombre")
          ||
          value.includes("apellido")
          ||
          value.includes("club")
          ||
          value.includes("nacimiento")
          ||
          value === "total"
          ||
          value.includes(
            "puntuación total"
          )
        );

      }
    );

  $("#view-internal")
    .innerHTML =
      `

      <div class="card">

        <div class="tabs">

        ${
          available
            .map(
              category =>
                `
                <button
                  type="button"
                  data-internal="${category}"
                  class="${
                    category
                    ===
                    internalCategory
                      ? "on"
                      : ""
                  }"
                >
                ${internalName(category)}
                </button>
                `
            )
            .join("")
        }

        </div>


        <div class="controls">

          <input
            id="internalSearch"
            placeholder="Buscar tiradora…"
            value="${
              escapeHtml(
                internalSearch
              )
            }"
          >

          <select
            id="internalClub"
          >

            <option value="">
            Todos los clubes
            </option>

            ${
              clubs
                .map(
                  club =>
                    `
                    <option
                      value="${
                        escapeHtml(club)
                      }"
                      ${
                        club
                        ===
                        internalClub
                          ? "selected"
                          : ""
                      }
                    >
                    ${escapeHtml(club)}
                    </option>
                    `
                )
                .join("")
            }

          </select>

          <span class="small muted">
          ${filtered.length}
          tiradoras
          </span>

        </div>


        <div class="success">

        <b>
        ${
          escapeHtml(
            current.name
            ||
            (
              "Ranking interno "
              +
              internalName(
                internalCategory
              )
            )
          )
        }
        </b>

        · Fecha de referencia:

        <b>
        ${
          escapeHtml(
            current.reference_date
            ||
            DATA
              .internal_rankings_updated_at
            ||
            "sin fecha"
          )
        }
        </b>

        · Mínimo de referencia:

        <b>
        ${formatNumber(minimum)}
        puntos
        </b>

        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th class="number">
                #
                </th>

                <th>
                Tiradora
                </th>

                <th>
                Club
                </th>

                <th>
                Año
                </th>

                ${
                  detailHeaders
                    .map(
                      header =>
                        `
                        <th class="number">
                        ${
                          escapeHtml(
                            header
                          )
                        }
                        </th>
                        `
                    )
                    .join("")
                }

                <th class="number">
                Total
                </th>

                <th>
                Progreso
                </th>

              </tr>

            </thead>

            <tbody>

            ${
              filtered
                .map(
                  row => {

                    const total =
                      Number(
                        row.total
                      )
                      ||
                      0;

                    const progress =
                      minimum > 0
                        ?
                        Math.min(
                          100,
                          total
                          /
                          minimum
                          *
                          100
                        )
                        :
                        0;

                    return `
                    <tr>

                      <td class="number">
                      <b>
                      ${
                        row.position
                        ??
                        "—"
                      }
                      </b>
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          row.full_name
                          ||
                          ""
                        )
                      }
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          row.club
                          ||
                          ""
                        )
                      }
                      </td>

                      <td>
                      ${
                        escapeHtml(
                          row.birth_year
                          ||
                          ""
                        )
                      }
                      </td>

                      ${
                        detailHeaders
                          .map(
                            header =>
                              `
                              <td class="number">
                              ${
                                escapeHtml(
                                  row.columns
                                    ?.[header]
                                  ||
                                  ""
                                )
                              }
                              </td>
                              `
                          )
                          .join("")
                      }

                      <td class="number">
                      <b>
                      ${formatNumber(total)}
                      </b>
                      </td>

                      <td>

                        <div class="progress">

                          <span
                            style="
                            width:${progress}%
                            ">
                          </span>

                        </div>

                        <div class="small muted">

                        ${formatNumber(total)}
                        /
                        ${formatNumber(minimum)}

                        </div>

                      </td>

                    </tr>
                    `;

                  }
                )
                .join("")
            }

            </tbody>

          </table>

        </div>


        <p class="small muted">

        Fuente:

        <a
          class="link"
          href="${
            escapeHtml(
              current.source_url
              ||
              "https://app.skermo.org/classification/public/RFEE?setLang=es"
            )
          }"
          target="_blank"
          rel="noopener"
        >

        Skermo RFEE ·
        Clasificaciones

        </a>

        </p>

      </div>
      `;

  $("#view-internal .tabs")
    .onclick =
      event => {

        const selected =
          event
            .target
            .dataset
            .internal;

        if(!selected){
          return;
        }

        internalCategory =
          selected;

        internalSearch =
          "";

        internalClub =
          "";

        renderInternalRanking();

      };

  $("#internalSearch")
    .oninput =
      event => {

        internalSearch =
          event.target.value;

        renderInternalRanking();

      };

  $("#internalClub")
    .onchange =
      event => {

        internalClub =
          event.target.value;

        renderInternalRanking();

      };

}


/* =========================================================
   CALCULADORA
   ========================================================= */

function bonus(
  position
){

  if(position === 1){
    return 1414;
  }

  if(position === 2){
    return 1212;
  }

  if(position <= 4){
    return 1010;
  }

  if(position <= 8){
    return 808;
  }

  if(position <= 16){
    return 606;
  }

  if(position <= 32){
    return 404;
  }

  if(position <= 64){
    return 202;
  }

  if(position <= 128){
    return 101;
  }

  return 0;
}


function calculateRFEE(
  position,
  participants,
  coefficient
){

  if(
    position < 1
    ||
    participants < 2
    ||
    position > participants
  ){
    return NaN;
  }

  const base =
    bonus(position)
    +
    1000
    *
    (
      1.01
      -
      Math.log10(position)
      /
      Math.log10(participants)
    );

  return base * coefficient;
}


function renderCalculator(){

  $("#view-calculator")
    .innerHTML =
      `

      <div class="grid grid-2">

        <div class="card">

          <h3>
          Calculadora de puntos RFEE
          </h3>

          <div class="controls">

            <label class="field">

            Posición

            <input
              id="calcPosition"
              type="number"
              min="1"
              value="1"
            >

            </label>


            <label class="field">

            Participantes

            <input
              id="calcParticipants"
              type="number"
              min="2"
              value="34"
            >

            </label>


            <label class="field">

            Coeficiente

            <select
              id="calcCoefficient"
            >

              <option value="1">
              Nacional ×1
              </option>

              <option value="1.25">
              Campeonato ×1,25
              </option>

              <option value="1.5">
              Absoluto ×1,5
              </option>

            </select>

            </label>

          </div>


          <div
            id="calcResult"
            class="result">
          </div>

        </div>


        <div class="card">

          <h3>
          Fórmula
          </h3>

          <p>

          Puntos =
          [Bonus +
          1000 ×
          (1,01 −
          log10(posición) /
          log10(participantes))]
          × coeficiente.

          </p>

          <p class="small muted">

          Bonus:
          1.º 1414;
          2.º 1212;
          3.º-4.º 1010;
          5.º-8.º 808;
          9.º-16.º 606;
          17.º-32.º 404;
          33.º-64.º 202;
          65.º-128.º 101.

          </p>

        </div>

      </div>
      `;

  function update(){

    const position =
      Number(
        $("#calcPosition")
          .value
      );

    const participants =
      Number(
        $("#calcParticipants")
          .value
      );

    const coefficient =
      Number(
        $("#calcCoefficient")
          .value
      );

    const points =
      calculateRFEE(
        position,
        participants,
        coefficient
      );

    $("#calcResult")
      .innerHTML =
        Number.isFinite(points)
          ?
          `
          <span class="small muted">
          Resultado
          </span>

          <strong>
          ${formatNumber(points)}
          puntos
          </strong>

          <span class="small muted">
          Posición ${position}
          de ${participants}
          · coeficiente
          ×${coefficient}
          </span>
          `
          :
          `
          <span class="error">
          Comprueba posición
          y participantes.
          </span>
          `;

  }

  [
    "calcPosition",
    "calcParticipants",
    "calcCoefficient"
  ]
  .forEach(
    id => {

      $("#" + id)
        .oninput =
          update;

    }
  );

  update();

}
