name: Actualizar dashboard Nacional y Regional

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-dashboard-esgrima
  cancel-in-progress: true

jobs:
  update-dashboard:
    name: Actualizar datos RFEE y FME
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Validar archivos requeridos
        run: |
          test -f scripts/update_rfee.py
          test -f scripts/update_internal_rfee.py
          test -f scripts/update_fme.py
          test -f data/nacional-rfee.json
          test -f data/regional-fme.json
          test -f docs/fme/Calendario.pdf
          test -f docs/fme/Competicion.pdf

      - name: Validar sintaxis Python
        run: |
          python -m py_compile scripts/update_rfee.py
          python -m py_compile scripts/update_internal_rfee.py
          python -m py_compile scripts/update_fme.py

      - name: Actualizar ranking nacional RFEE
        run: |
          python scripts/update_rfee.py

      - name: Validar ranking nacional RFEE
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/nacional-rfee.json")

          if not path.exists():
              raise SystemExit(
                  "No existe data/nacional-rfee.json"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          rankings = data.get("rankings", {})

          if not rankings:
              raise SystemExit(
                  "El JSON nacional no contiene rankings"
              )

          m15 = rankings.get("M15", [])

          if not m15:
              raise SystemExit(
                  "El ranking nacional M15 está vacío"
              )

          positives = sum(
              float(row.get("points", 0) or 0) > 0
              for row in m15
          )

          if positives == 0:
              raise SystemExit(
                  "M15 contiene tiradoras, pero todos "
                  "los puntos son cero"
              )

          print(
              "Ranking M15 validado:",
              len(m15),
              "tiradoras;",
              positives,
              "con puntos positivos"
          )
          PY

      - name: Actualizar ranking interno RFEE
        id: internal_ranking
        continue-on-error: true
        run: |
          python scripts/update_internal_rfee.py

      - name: Informar del resultado del ranking interno
        if: always()
        run: |
          if [ "${{ steps.internal_ranking.outcome }}" = "success" ]; then
            echo "El ranking interno RFEE se actualizó correctamente."
          else
            echo "::warning::No se pudo actualizar el ranking interno RFEE."
            echo "::warning::Se conservarán los últimos datos internos válidos si existen."
          fi

      - name: Validar ranking interno si existe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/nacional-rfee.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          internal = data.get(
              "internal_rankings",
              {}
          )

          if not internal:
              print(
                  "AVISO: todavía no existe internal_rankings."
              )
              print(
                  "La actualización general continuará."
              )
              raise SystemExit(0)

          categories = [
              category
              for category in ["M17", "M20"]
              if (
                  category in internal
                  and internal[category].get("rows")
              )
          ]

          if not categories:
              print(
                  "AVISO: internal_rankings existe, "
                  "pero no contiene filas M17 o M20."
              )
              raise SystemExit(0)

          for category in categories:
              ranking = internal[category]
              rows = ranking.get("rows", [])

              positives = sum(
                  float(row.get("total", 0) or 0) > 0
                  for row in rows
              )

              print(
                  category,
                  len(rows),
                  "tiradoras;",
                  positives,
                  "totales positivos"
              )

          print(
              "Ranking interno disponible:",
              ", ".join(categories)
          )
          PY

      - name: Actualizar datos regionales FME
        run: |
          python scripts/update_fme.py

      - name: Validar JSON nacional y regional
        run: |
          python -m json.tool \
            data/nacional-rfee.json \
            > /dev/null

          python -m json.tool \
            data/regional-fme.json \
            > /dev/null

      - name: Validar calendario regional
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/regional-fme.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          calendar = data.get(
              "calendar",
              []
          )

          if len(calendar) <= 1:
              raise SystemExit(
                  "El calendario regional contiene "
                  "una o ninguna competición"
              )

          print(
              "Calendario regional validado:",
              len(calendar),
              "competiciones"
          )
          PY

      - name: Mostrar resumen de actualización
        run: |
          python - <<'PY'
          import json

          national = json.load(
              open(
                  "data/nacional-rfee.json",
                  encoding="utf-8"
              )
          )

          regional = json.load(
              open(
                  "data/regional-fme.json",
                  encoding="utf-8"
              )
          )

          print(
              "Actualización nacional:",
              national.get("updated_at")
          )

          print(
              "M15 nacional:",
              len(
                  national
                  .get("rankings", {})
                  .get("M15", [])
              ),
              "tiradoras"
          )

          internal = national.get(
              "internal_rankings",
              {}
          )

          print(
              "Ranking interno:",
              ", ".join(internal.keys())
              if internal
              else "no disponible"
          )

          print(
              "Actualización regional:",
              regional.get("updated_at")
          )

          print(
              "Calendario regional:",
              len(
                  regional.get(
                      "calendar",
                      []
                  )
              ),
              "pruebas"
          )
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nacional-rfee.json
          git add data/regional-fme.json

          if git diff --cached --quiet; then
            echo "No hay datos nuevos que guardar."
          else
            git commit -m "Actualizar datos RFEE y FME"
            git push
          fi
