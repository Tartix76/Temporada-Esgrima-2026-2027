name: Actualizar dashboard Nacional y Regional

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-dashboard-esgrima
  cancel-in-progress: true

jobs:

  update-dashboard:

    name: Actualizar datos RFEE y FME

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      # ======================================================
      # REPOSITORIO
      # ======================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      - name: Sincronizar con main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Instalar Chromium para Playwright
        run: |
          python -m playwright install --with-deps chromium


      # ======================================================
      # COMPROBAR ARCHIVOS
      # ======================================================

      - name: Validar archivos requeridos
        run: |
          test -f scripts/update_rfee.py
          test -f scripts/update_internal_rfee.py
          test -f scripts/update_fme.py

          test -f data/nacional-rfee.json
          test -f data/regional-fme.json
          test -f data/internal-rfee-fallback.json

          test -f docs/fme/Calendario.pdf
          test -f docs/fme/Competicion.pdf


      # ======================================================
      # COMPROBAR SINTAXIS
      # ======================================================

      - name: Validar sintaxis Python
        run: |
          python -m py_compile scripts/update_rfee.py
          python -m py_compile scripts/update_internal_rfee.py
          python -m py_compile scripts/update_fme.py


      # ======================================================
      # RANKING NACIONAL RFEE
      # ======================================================

      - name: Actualizar ranking nacional RFEE
        run: |
          python scripts/update_rfee.py


      - name: Validar ranking nacional RFEE
        run: |
          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "data/nacional-rfee.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          rankings = data.get(
              "rankings",
              {}
          )

          if not rankings:
              raise SystemExit(
                  "El JSON nacional "
                  "no contiene rankings"
              )

          m15 = rankings.get(
              "M15",
              []
          )

          if not m15:
              raise SystemExit(
                  "El ranking M15 "
                  "está vacío"
              )

          positives = sum(
              float(
                  row.get(
                      "points",
                      0
                  )
                  or
                  0
              )
              > 0
              for row
              in m15
          )

          if positives == 0:
              raise SystemExit(
                  "M15 contiene "
                  "tiradoras pero todos "
                  "los puntos son cero"
              )

          print(
              "Ranking M15 validado"
          )

          print(
              "Tiradoras:",
              len(m15)
          )

          print(
              "Con puntos positivos:",
              positives
          )

          PY


      # ======================================================
      # RANKING INTERNO RFEE
      # ======================================================

      - name: Actualizar ranking interno RFEE
        id: ranking_interno
        continue-on-error: true
        run: |
          python scripts/update_internal_rfee.py


      - name: Comprobar resultado ranking interno
        if: always()
        run: |
          if [ "${{ steps.ranking_interno.outcome }}" = "success" ]; then

            echo "Ranking interno RFEE actualizado correctamente."

          else

            echo "::warning::No se pudo actualizar directamente el ranking interno RFEE."

            echo "::warning::El dashboard continuará usando los últimos datos internos válidos."

          fi


      # ======================================================
      # VALIDAR RANKING INTERNO
      # ======================================================

      - name: Validar ranking interno RFEE
        run: |
          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "data/nacional-rfee.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          internal = data.get(
              "internal_rankings",
              {}
          )

          if not internal:

              print(
                  "AVISO: no hay "
                  "internal_rankings."
              )

              print(
                  "El workflow continuará."
              )

              raise SystemExit(0)


          for category in [
              "M17",
              "M20"
          ]:

              ranking = internal.get(
                  category
              )

              if not ranking:

                  print(
                      category,
                      "no disponible"
                  )

                  continue


              rows = ranking.get(
                  "rows",
                  []
              )


              positives = sum(
                  float(
                      row.get(
                          "total",
                          0
                      )
                      or
                      0
                  )
                  > 0
                  for row
                  in rows
              )


              print(
                  category,
                  ":",
                  len(rows),
                  "tiradoras"
              )


              print(
                  category,
                  ":",
                  positives,
                  "con puntos positivos"
              )


          print(
              "Validación ranking "
              "interno terminada."
          )

          PY


      # ======================================================
      # REGIONAL FME
      # ======================================================

      - name: Actualizar datos regionales FME
        run: |
          python scripts/update_fme.py


      # ======================================================
      # VALIDAR JSON
      # ======================================================

      - name: Validar JSON nacional
        run: |
          python -m json.tool data/nacional-rfee.json > /dev/null


      - name: Validar JSON regional
        run: |
          python -m json.tool data/regional-fme.json > /dev/null


      # ======================================================
      # VALIDAR REGIONAL
      # ======================================================

      - name: Validar calendario regional
        run: |
          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "data/regional-fme.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          calendar = data.get(
              "calendar",
              []
          )

          if len(calendar) <= 1:

              raise SystemExit(
                  "El calendario regional "
                  "contiene una o ninguna "
                  "competición"
              )


          print(
              "Calendario regional:",
              len(calendar),
              "competiciones"
          )

          PY


      # ======================================================
      # RESUMEN
      # ======================================================

      - name: Mostrar resumen
        run: |
          python - <<'PY'

          import json

          with open(
              "data/nacional-rfee.json",
              encoding="utf-8"
          ) as file:

              national = json.load(
                  file
              )


          with open(
              "data/regional-fme.json",
              encoding="utf-8"
          ) as file:

              regional = json.load(
                  file
              )


          print(
              "=============================="
          )

          print(
              "RESUMEN DE ACTUALIZACIÓN"
          )

          print(
              "=============================="
          )


          print(
              "Nacional:",
              national.get(
                  "updated_at"
              )
          )


          m15 = (
              national
              .get(
                  "rankings",
                  {}
              )
              .get(
                  "M15",
                  []
              )
          )


          print(
              "M15:",
              len(m15),
              "tiradoras"
          )


          internal = national.get(
              "internal_rankings",
              {}
          )


          print(
              "Ranking interno:",
              ", ".join(
                  internal.keys()
              )
              if internal
              else
              "no disponible"
          )


          print(
              "Estado interno:",
              national.get(
                  "internal_rankings_status",
                  "sin estado"
              )
          )


          print(
              "Regional:",
              regional.get(
                  "updated_at"
              )
          )


          print(
              "Calendario regional:",
              len(
                  regional.get(
                      "calendar",
                      []
                  )
              )
          )


          print(
              "=============================="
          )

          PY


      # ======================================================
      # PREPARAR CAMBIOS
      # ======================================================

      - name: Comprobar cambios generados
        run: |
          echo "Estado del repositorio:"
          git status --short


      - name: Preparar cambios de datos
        run: |
          git add data/nacional-rfee.json
          git add data/regional-fme.json

          echo "Cambios preparados:"

          git diff --cached --stat


      # ======================================================
      # PUBLICACIÓN
      # ======================================================

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then

            echo "No hay datos nuevos que guardar."

            exit 0

          fi

          echo "Creando commit..."

          git commit -m "Actualizar datos RFEE y FME"

          echo "Publicando commit..."

          git push origin HEAD:main

          echo "Datos publicados correctamente."
