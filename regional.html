<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regional Madrid · Sable femenino</title><style>:root{--b:#f5f6fa;--c:#fff;--i:#1b2333;--m:#667085;--l:#e4e7ee;--a2:#1f3a68}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--b);color:var(--i)}main{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:14px}h2,h3{margin-top:0}.mut{color:var(--m)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--l);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--a2);color:#fff}.chip:focus-visible{outline:3px solid #f0b429}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left}th{font-size:12px;color:var(--m);position:sticky;top:0;background:#fafbfd}.scroll{overflow:auto;max-height:540px}.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#eef1f7}.warn{background:#fff8e6;border:1px solid #f1dfb0;padding:10px;border-radius:9px}a{color:var(--a2)}</style></head><body><main><div class="card"><h2>Fase regional · Madrid</h2><p class="mut">Sable femenino · M13, M15, M17, M20 y Absoluto · <span id="updated">Cargando…</span></p><div class="chips" id="tabs"><button class="chip on" type="button" data-tab="summary">Resumen</button><button class="chip" type="button" data-tab="ranking">Ranking</button><button class="chip" type="button" data-tab="calendar">Calendario</button><button class="chip" type="button" data-tab="results">Resultados</button><button class="chip" type="button" data-tab="sources">Fuentes</button></div></div><section id="output" aria-live="polite"></section></main><script>(()=>{let data=null,tab='summary';const output=document.querySelector('#output'),updated=document.querySelector('#updated'),tabs=document.querySelector('#tabs');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=x=>/^https:\/\//i.test(String(x||''))?esc(x):'#';fetch('data/regional-fme.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;updated.textContent='Última actualización: '+d.updated_at;render()}).catch(()=>{output.innerHTML='<div class="warn">No se pudo cargar el fichero regional. Ejecuta la acción “Actualizar datos FME” en GitHub Actions y vuelve a intentarlo.</div>'});tabs.addEventListener('click',e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));render()});function empty(msg){return '<p class="mut">'+msg+'</p>'}function render(){if(!data)return;if(tab==='summary'){const nr=Object.values(data.rankings||{}).reduce((a,x)=>a+x.length,0);output.innerHTML=`<div class="grid"><div class="card"><h3>Ranking</h3><b>${nr}</b><p class="mut">registros regionales</p></div><div class="card"><h3>Calendario</h3><b>${data.calendar.length}</b><p class="mut">pruebas de sable femenino</p></div><div class="card"><h3>Resultados</h3><b>${data.results.length}</b><p class="mut">enlaces detectados</p></div></div><div class="card"><h3>Próximas pruebas</h3>${data.calendar.slice(0,8).map(e=>`<p><b>${esc(e.date)}</b> · ${esc(e.name)} <span class="tag">${esc(e.category)}</span> · ${esc(e.location)}</p>`).join('')||empty('Sin pruebas cargadas todavía.')}</div>`}else if(tab==='ranking'){output.innerHTML='<div class="card"><h3>Ranking FME</h3>'+Object.entries(data.rankings||{}).map(([c,rows])=>`<h3>${esc(c)}</h3>${rows.length?`<div class="scroll"><table><thead><tr><th>#</th><th>Tiradora</th><th>Club</th><th>Puntos</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.position)}</td><td>${esc(r.name)}</td><td>${esc(r.club)}</td><td>${esc(r.points)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin datos publicados o no detectados.')}`).join('')+'</div>'}else if(tab==='calendar'){output.innerHTML=`<div class="card"><h3>Calendario FME</h3>${data.calendar.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Competición</th><th>Categoría</th><th>Lugar</th></tr></thead><tbody>${data.calendar.map(e=>`<tr><td>${esc(e.date)}</td><td><a href="${safeUrl(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a></td><td>${esc(e.category)}</td><td>${esc(e.location)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin competiciones detectadas.')}</div>`}else if(tab==='results'){output.innerHTML=`<div class="card"><h3>Resultados regionales</h3>${data.results.map(e=>`<p><a href="${safeUrl(e.url)}" target="_blank" rel="noopener"><b>${esc(e.name)}</b></a> · ${esc(e.date||'')} · ${esc(e.category||'')}</p>`).join('')||empty('Engarde carga sus competiciones dinámicamente. Si no aparecen aquí, usa el enlace oficial de la pestaña Fuentes.')}</div>`}else{output.innerHTML='<div class="card"><h3>Fuentes oficiales</h3><ul>'+data.sources.map(x=>`<li><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a><br><span class="mut">${esc(x.use)}</span></li>`).join('')+'</ul></div>'}}})();</script></body></html>
