<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sable femenino · Regional Madrid</title><style>
:root{--nav:#2d568f;--bg:#f4f6fa;--card:#fff;--line:#dce2ec;--text:#172033;--mut:#65718a;--acc:#bf2c32;--chip:#edf2f9;--ok:#147a51}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text)}header{background:var(--nav);color:#fff;padding:17px 20px 0}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;margin-bottom:16px}nav{display:flex;gap:0;flex-wrap:wrap}nav button{border:0;background:none;color:#eaf0fa;padding:13px 16px;font-weight:700;cursor:pointer}nav button.on{background:#fff;color:#234878;border-radius:9px 9px 0 0}main{max-width:1160px;margin:auto;padding:18px}.hide{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kicker{font-size:12px;color:var(--mut);text-transform:uppercase}.big{font-size:22px;font-weight:800;margin:5px 0}.mut{color:var(--mut)}.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}.cats button.on{background:#244d84;color:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut);background:#fafbfd;position:sticky;top:0}td.num,th.num{text-align:right}.bar{display:inline-block;height:6px;background:var(--acc);border-radius:9px;margin-left:8px;vertical-align:middle}.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:#244d84;font-weight:600}.ev{padding:11px 0;border-bottom:1px solid var(--line)}a{color:#244d84}.note{background:#fff8e6;border:1px solid #f1dfb0;border-radius:10px;padding:10px 12px}.leadtable td:first-child{font-weight:800}@media(max-width:800px){.grid4,.grid2{grid-template-columns:1fr}main{padding:10px}nav button{padding:11px 10px}.row input{width:100%}}</style></head><body><header><h1>Sable femenino · Temporada 2026-27</h1><div class="sub">Fase Regional Madrid · FME · M13 · M15 · M17 · M20 · Absoluto · Datos de Skermo FME · <span id="snap">cargando…</span></div><nav id="nav"></nav></header><main><section id="t-resumen"></section><section id="t-ranking" class="hide"></section><section id="t-calendario" class="hide"></section><section id="t-resultados" class="hide"></section><section id="t-fuentes" class="hide"></section></main><script>
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const safe=x=>/^https:\/\//i.test(String(x||''))?esc(x):'#';
const TABS=[['resumen','Resumen'],['ranking','Rankings'],['calendario','Calendario'],['resultados','Resultados'],['fuentes','Fuentes']];
$('#nav').innerHTML=TABS.map(([k,l],i)=>`<button type="button" data-t="${k}" class="${i?'':'on'}">${l}</button>`).join(''); $('#nav').onclick=e=>{let t=e.target.dataset.t;if(!t)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));TABS.forEach(([k])=>$('#t-'+k).classList.toggle('hide',k!==t))};
let D=null,cat='M17'; fetch('data/regional-fme.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;$('#snap').textContent='actualizado '+d.updated_at;render()}).catch(()=>{$('#t-resumen').innerHTML='<div class="note">No se pudieron cargar los datos regionales.</div>'});
function validCats(){return ['M13','M15','M17','M20','ABS'].filter(c=>D.rankings?.[c])}function label(c){return c==='ABS'?'Absoluto':c}function today(){return new Date()}
function dateVal(s){let m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function render(){renderSummary();renderRank();renderCalendar();renderResults();renderSources()}
function renderSummary(){let cats=validCats(),leaders=cats.map(c=>[c,D.rankings[c]?.[0]]),future=D.calendar.filter(e=>{let d=dateVal(e.date);return !d||d>=new Date(today().getFullYear(),today().getMonth(),today().getDate())});let next=future[0], total=Object.values(D.rankings).reduce((a,x)=>a+x.length,0);$('#t-resumen').innerHTML=`<div class="grid4"><div class="card"><div class="kicker">Próxima regional</div><div class="big">${esc(next?.name||'Pendiente')}</div><div class="mut">${esc(next?.date||'Sin fecha')} · ${esc(next?.location||'')}</div></div><div class="card"><div class="kicker">Rankings publicados</div><div class="big">${cats.length}</div><div class="mut">M13 · M15 · M17 · M20 · Absoluto</div></div><div class="card"><div class="kicker">Tiradoras clasificadas</div><div class="big">${total}</div><div class="mut">registros en rankings FME</div></div><div class="card"><div class="kicker">Pruebas detectadas</div><div class="big">${D.calendar.length}</div><div class="mut">calendario regional</div></div></div><div class="grid2"><div class="card"><h3>Líderes del ranking regional</h3><table class="leadtable"><tr><th>Categoría</th><th>Líder</th><th>Club</th><th>Puntos</th></tr>${leaders.map(([c,r])=>`<tr><td>${label(c)}</td><td>${esc(r?.name||'Sin datos')}</td><td>${esc(r?.club||'—')}</td><td>${esc(r?.points||'—')}</td></tr>`).join('')}</table></div><div class="card"><h3>Próximas competiciones regionales</h3>${future.slice(0,5).map(e=>`<div class="ev"><b>${esc(e.name)}</b><br><span class="mut">${esc(e.date)} · ${esc(e.location)}</span> <span class="tag">${esc(e.category)}</span></div>`).join('')||'<p class="mut">Sin próximas pruebas detectadas.</p>'}</div></div>`}
function renderRank(){let cats=validCats();$('#t-ranking').innerHTML=`<div class="card"><div class="cats">${cats.map(c=>`<button type="button" data-c="${c}" class="${c===cat?'on':''}">${label(c)}</button>`).join('')}</div><div class="row"><input id="q" placeholder="Buscar tiradora…"><select id="club"><option value="">Todos los clubes</option></select><span id="count" class="mut"></span></div><div id="rankbody"></div></div>`; document.querySelector('.cats').onclick=e=>{if(!e.target.dataset.c)return;cat=e.target.dataset.c;renderRank()};let clubs=[...new Set((D.rankings[cat]||[]).map(x=>x.club).filter(Boolean))].sort();$('#club').innerHTML += clubs.map(x=>`<option>${esc(x)}</option>`).join('');$('#q').oninput=drawRank;$('#club').onchange=drawRank;drawRank()}
function drawRank(){let rows=D.rankings[cat]||[],q=($('#q')?.value||'').toUpperCase(),club=$('#club')?.value||'';rows=rows.filter(r=>(!q||r.name.toUpperCase().includes(q))&&(!club||r.club===club));let max=Math.max(1,...rows.map(r=>parseFloat(String(r.points).replace(',','.'))||0));$('#count').textContent=`${rows.length} tiradoras`;$('#rankbody').innerHTML=`<div class="tbl"><table><tr><th>#</th><th>TIRADORA</th><th>CLUB</th><th class="num">PUNTOS</th></tr>${rows.map(r=>{let p=parseFloat(String(r.points).replace(',','.'))||0;return `<tr><td><b>${esc(r.position)}</b></td><td>${esc(r.name)}</td><td>${esc(r.club)}</td><td class="num">${esc(r.points)} <span class="bar" style="width:${Math.round(130*p/max)}px"></span></td></tr>`}).join('')}</table></div>`}
function renderCalendar(){$('#t-calendario').innerHTML=`<div class="card"><h3>Calendario regional FME</h3>${D.calendar.length?`<div class="tbl"><table><tr><th>Fecha</th><th>Competición</th><th>Categoría</th><th>Lugar</th></tr>${D.calendar.map(e=>`<tr><td>${esc(e.date)}</td><td><a target="_blank" rel="noopener" href="${safe(e.url)}">${esc(e.name)}</a></td><td><span class="tag">${esc(e.category)}</span></td><td>${esc(e.location)}</td></tr>`).join('')}</table></div>`:'<p class="mut">Sin pruebas detectadas.</p>'}</div>`}
function renderResults(){$('#t-resultados').innerHTML=`<div class="card"><h3>Resultados regionales</h3>${D.results.map(e=>`<div class="ev"><a target="_blank" rel="noopener" href="${safe(e.url)}"><b>${esc(e.name)}</b></a> · ${esc(e.date||'')} ${e.category?`<span class="tag">${esc(e.category)}</span>`:''}</div>`).join('')||'<p class="mut">No se han detectado enlaces de resultados todavía. Consulta Engarde en Fuentes.</p>'}</div>`}
function renderSources(){$('#t-fuentes').innerHTML=`<div class="card"><h3>Fuentes oficiales FME</h3>${D.sources.map(x=>`<p><a target="_blank" rel="noopener" href="${safe(x.url)}"><b>${esc(x.name)}</b></a><br><span class="mut">${esc(x.use)}</span></p>`).join('')}</div>`}
</script></body></html>
