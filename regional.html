<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sable femenino · Regional Madrid</title>
<style>
:root{--nav:#315f9d;--bg:#f4f6fa;--card:#fff;--line:#dce2ec;--text:#172033;--mut:#65718a;--red:#bf2c32;--blue:#244d84;--chip:#edf2f9}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text)}header{background:var(--nav);color:#fff;padding:18px 20px 0}h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;margin-bottom:16px}nav{display:flex;flex-wrap:wrap;gap:2px}nav button{border:0;background:transparent;color:#eef4ff;padding:12px 15px;font-weight:700;cursor:pointer}nav button.on{background:#fff;color:var(--blue);border-radius:9px 9px 0 0}main{max-width:1180px;margin:auto;padding:18px}.hide{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kicker{font-size:12px;color:var(--mut);text-transform:uppercase}.big{font-size:22px;font-weight:800;margin:5px 0}.mut{color:var(--mut)}.cats,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}.cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}.cats button.on{background:var(--blue);color:#fff}input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.tbl{max-height:580px;overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut);background:#fafbfd;position:sticky;top:0}td.num,th.num{text-align:right}.bar{display:inline-block;height:6px;background:var(--red);border-radius:9px;margin-left:8px;vertical-align:middle}.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--blue);font-weight:600}.ev{padding:11px 0;border-bottom:1px solid var(--line)}a{color:var(--blue)}.note{background:#fff8e6;border:1px solid #f1dfb0;border-radius:10px;padding:12px}.result{background:#eef5ff;border:1px solid #cadcf5;border-radius:10px;padding:14px;margin-top:12px}.result .big{color:var(--blue);font-size:28px}.error{color:#a11;background:#fff1f1;border:1px solid #f3c9c9;padding:12px;border-radius:10px}@media(max-width:850px){.grid4,.grid2{grid-template-columns:1fr}main{padding:10px}nav button{padding:10px 8px}.row input{width:100%}}
</style>
</head>
<body>
<header>
<h1>Sable femenino · Temporada 2026-27</h1>
<div class="sub">Fase Regional Madrid · FME · M13 · M15 · M17 · M20 · Absoluto · <span id="snapshot">cargando datos…</span></div>
<nav id="nav"></nav>
</header>
<main>
<section id="tab-resumen"></section>
<section id="tab-rankings" class="hide"></section>
<section id="tab-calendario" class="hide"></section>
<section id="tab-resultados" class="hide"></section>
<section id="tab-calculadora" class="hide"></section>
<section id="tab-normativa" class="hide"></section>
<section id="tab-fuentes" class="hide"></section>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=x=>{const u=String(x||'');return /^(https:\/\/|docs\/)/i.test(u)?esc(u):'#'};
const tabs=[['resumen','Resumen'],['rankings','Rankings'],['calendario','Calendario'],['resultados','Resultados'],['calculadora','Calculadora de puntos'],['normativa','Normativa'],['fuentes','Fuentes']];
let data=null,rankCat='M17';
$('#nav').innerHTML=tabs.map(([k,l],i)=>`<button type="button" data-tab="${k}" class="${i?'':'on'}">${l}</button>`).join('');
$('#nav').addEventListener('click',e=>{const t=e.target.dataset.tab;if(!t)return;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));tabs.forEach(([k])=>$('#tab-'+k).classList.toggle('hide',k!==t));});
function dateVal(s){const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function label(c){return c==='ABS'?'Absoluto':c}
function categories(){return ['M13','M15','M17','M20','ABS'].filter(c=>data.rankings&&Array.isArray(data.rankings[c]))}
function isFuture(e){const d=dateVal(e.date);const n=new Date();n.setHours(0,0,0,0);return d&&d>=n}
fetch('data/regional-fme.json?v='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
.then(d=>{data=d;$('#snapshot').textContent='Última actualización: '+(d.updated_at||'sin fecha');renderAll()})
.catch(err=>{$('#snapshot').textContent='error al cargar';$('#tab-resumen').innerHTML=`<div class="error">No se pudo cargar data/regional-fme.json: ${esc(err.message)}</div>`});
function renderAll(){renderSummary();renderRankings();renderCalendar();renderResults();renderCalculator();renderRules();renderSources()}
function renderSummary(){
 const cats=categories(), total=Object.values(data.rankings||{}).reduce((a,x)=>a+(Array.isArray(x)?x.length:0),0), upcoming=(data.calendar||[]).filter(isFuture), next=upcoming[0];
 $('#tab-resumen').innerHTML=`<div class="grid4"><div class="card"><div class="kicker">Próxima regional</div><div class="big">${esc(next?.name||'Pendiente')}</div><div class="mut">${esc(next?.date||'Sin fecha')} · ${esc(next?.location||'')}</div></div><div class="card"><div class="kicker">Rankings publicados</div><div class="big">${cats.length}</div><div class="mut">M13 · M15 · M17 · M20 · Absoluto</div></div><div class="card"><div class="kicker">Tiradoras clasificadas</div><div class="big">${total}</div><div class="mut">registros regionales FME</div></div><div class="card"><div class="kicker">Calendario</div><div class="big">${(data.calendar||[]).length}</div><div class="mut">pruebas territoriales detectadas</div></div></div><div class="grid2"><div class="card"><h3>Líderes del ranking regional</h3><table><tr><th>Categoría</th><th>Líder</th><th>Club</th><th>Puntos</th></tr>${cats.map(c=>{const r=data.rankings[c]?.[0];return `<tr><td><b>${label(c)}</b></td><td>${esc(r?.name||'Sin datos')}</td><td>${esc(r?.club||'—')}</td><td>${esc(r?.points||'—')}</td></tr>`}).join('')}</table></div><div class="card"><h3>Próximas competiciones</h3>${upcoming.slice(0,6).map(e=>`<div class="ev"><b>${esc(e.name)}</b><br><span class="mut">${esc(e.date)}${e.end_date?' – '+esc(e.end_date):''} · ${esc(e.location||'')}</span> <span class="tag">${esc(e.category||'')}</span></div>`).join('')||'<p class="mut">No hay próximas pruebas detectadas.</p>'}</div></div>`;
}
function renderRankings(){
 const cats=categories(); if(!cats.includes(rankCat))rankCat=cats[0]||'M17';
 $('#tab-rankings').innerHTML=`<div class="card"><div class="cats">${cats.map(c=>`<button type="button" data-cat="${c}" class="${c===rankCat?'on':''}">${label(c)}</button>`).join('')}</div><div class="row"><input id="rankSearch" placeholder="Buscar tiradora…"><select id="clubFilter"><option value="">Todos los clubes</option></select><span id="rankCount" class="mut"></span></div><div id="rankBody"></div></div>`;
 document.querySelector('.cats').addEventListener('click',e=>{if(!e.target.dataset.cat)return;rankCat=e.target.dataset.cat;renderRankings()});
 const clubs=[...new Set((data.rankings[rankCat]||[]).map(x=>x.club).filter(Boolean))].sort(); $('#clubFilter').innerHTML+=clubs.map(x=>`<option>${esc(x)}</option>`).join(''); $('#rankSearch').addEventListener('input',drawRank);$('#clubFilter').addEventListener('change',drawRank);drawRank();
}
function drawRank(){let rows=data.rankings[rankCat]||[],q=($('#rankSearch').value||'').toUpperCase(),club=$('#clubFilter').value;rows=rows.filter(r=>(!q||String(r.name).toUpperCase().includes(q))&&(!club||r.club===club));const max=Math.max(1,...rows.map(r=>parseFloat(String(r.points).replace(',','.'))||0));$('#rankCount').textContent=rows.length+' tiradoras';$('#rankBody').innerHTML=`<div class="tbl"><table><tr><th>#</th><th>Tiradora</th><th>Club</th><th class="num">Puntos</th></tr>${rows.map(r=>{const p=parseFloat(String(r.points).replace(',','.'))||0;return `<tr><td><b>${esc(r.position)}</b></td><td>${esc(r.name)}</td><td>${esc(r.club)}</td><td class="num">${esc(r.points)} <span class="bar" style="width:${Math.round(120*p/max)}px"></span></td></tr>`}).join('')}</table></div>`}
function renderCalendar(){
 const cs=['TODAS','M13','M15','M17','M20','ABS'];
 $('#tab-calendario').innerHTML=`<div class="card"><h3>Calendario territorial completo · Sable femenino</h3><div class="row"><select id="calendarCat">${cs.map(c=>`<option value="${c}">${c==='TODAS'?'Todas las categorías':label(c)}</option>`).join('')}</select><select id="calendarState"><option value="all">Todas</option><option value="next">Próximas</option><option value="done">Finalizadas</option></select></div><div id="calendarBody"></div></div>`;
 $('#calendarCat').addEventListener('change',drawCalendar);$('#calendarState').addEventListener('change',drawCalendar);drawCalendar();
}
function drawCalendar(){const c=$('#calendarCat').value,st=$('#calendarState').value;let rows=data.calendar||[];rows=rows.filter(e=>c==='TODAS'||(Array.isArray(e.categories)?e.categories.includes(c):String(e.category||'').includes(c)));rows=rows.filter(e=>st==='all'||(st==='next'&&isFuture(e))||(st==='done'&&!isFuture(e)));$('#calendarBody').innerHTML=rows.length?`<div class="tbl"><table><tr><th>Fecha</th><th>Competición</th><th>Categoría</th><th>Tipo</th><th>Cierre inscripción</th><th>Estado</th></tr>${rows.map(e=>`<tr><td>${esc(e.date)}${e.end_date&&e.end_date!==e.date?' – '+esc(e.end_date):''}</td><td><a href="${safeUrl(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a></td><td><span class="tag">${esc(e.category||'')}</span></td><td>${esc(e.type||'Territorial')}</td><td>${esc(e.registration_deadline||'—')}</td><td><span class="tag">${isFuture(e)?'Próxima':'Finalizada'}</span></td></tr>`).join('')}</table></div>`:'<p class="mut">No hay pruebas con estos filtros.</p>'}
function renderResults(){$('#tab-resultados').innerHTML=`<div class="card"><h3>Resultados regionales</h3>${(data.results||[]).map(e=>`<div class="ev"><a href="${safeUrl(e.url)}" target="_blank" rel="noopener"><b>${esc(e.name)}</b></a> · ${esc(e.date||'')} ${e.category?`<span class="tag">${esc(e.category)}</span>`:''}</div>`).join('')||'<p class="mut">No hay resultados detectados todavía. Consulta Engarde desde Fuentes.</p>'}</div>`}
function pointsFor(pos){const rules=data.points_rules?.scale||[{from:1,to:1,points:32},{from:2,to:2,points:26},{from:3,to:4,points:20},{from:5,to:8,points:14},{from:9,to:16,points:8},{from:17,to:32,points:4},{from:33,to:64,points:2},{from:65,to:128,points:1}];return rules.find(r=>pos>=r.from&&pos<=r.to)?.points||0}
function renderCalculator(){
 $('#tab-calculadora').innerHTML=`<div class="grid2"><div class="card"><h3>Calculadora de puntos FME</h3><div class="row"><label>Categoría <select id="ptsCat"><option>M13</option><option>M15</option><option selected>M17</option><option>M20</option><option>Absoluto</option></select></label><label>Tipo <select id="ptsType"><option value="1">Fase territorial</option><option value="2">Campeonato de Madrid (×2)</option></select></label><label>Posición <input id="ptsPos" type="number" min="1" max="128" value="1"></label></div><div id="ptsResult" class="result"></div></div><div class="card"><h3>Escala oficial FME</h3><table><tr><th>Clasificación</th><th>Puntos</th></tr><tr><td>1ª</td><td>32</td></tr><tr><td>2ª</td><td>26</td></tr><tr><td>3ª-4ª</td><td>20</td></tr><tr><td>5ª-8ª</td><td>14</td></tr><tr><td>9ª-16ª</td><td>8</td></tr><tr><td>17ª-32ª</td><td>4</td></tr><tr><td>33ª-64ª</td><td>2</td></tr><tr><td>65ª-128ª</td><td>1</td></tr></table></div></div>`;
 ['ptsCat','ptsType','ptsPos'].forEach(id=>$('#'+id).addEventListener('input',calculatePoints));calculatePoints();
}
function calculatePoints(){const p=Math.max(1,Math.min(128,parseInt($('#ptsPos').value,10)||1)),base=pointsFor(p),mult=Number($('#ptsType').value),total=base*mult;$('#ptsResult').innerHTML=`<div class="kicker">Resultado</div><div class="big">${total} puntos</div><div>${esc($('#ptsCat').value)} · Puesto ${p} · ${base} puntos base${mult===2?' × 2 por Campeonato de Madrid':''}</div>`}
function renderRules(){$('#tab-normativa').innerHTML=`<div class="grid2"><div class="card"><h3>Normativa clave</h3><ul><li>El ranking comienza de cero al inicio de la temporada.</li><li>Solo computan torneos de la categoría correspondiente.</li><li>El Campeonato de Madrid puntúa doble.</li><li>En empate se comparan primero los primeros puestos, luego segundos, etc.</li><li>La inscripción ordinaria por Skermo cierra a las 23:59 del miércoles anterior.</li></ul></div><div class="card"><h3>Inscripciones</h3><ul><li>Inscripción FME: 15 €.</li><li>Licencia de otra federación: 40 €.</li><li>Inscripción FME fuera de plazo: 20 €.</li><li>No presentación estando inscrita: 5 €.</li></ul><p><a href="docs/fme/Competicion.pdf" target="_blank" rel="noopener">Abrir normativa oficial FME</a></p></div></div>`}
function renderSources(){$('#tab-fuentes').innerHTML=`<div class="card"><h3>Fuentes oficiales</h3>${(data.sources||[]).map(x=>`<p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener"><b>${esc(x.name)}</b></a><br><span class="mut">${esc(x.use)}</span></p>`).join('')}</div>`}
})();
</script>
</body>
</html>
